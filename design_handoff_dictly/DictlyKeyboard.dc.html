<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>@keyframes dkGlow{0%{transform:scale(1);opacity:.18}100%{transform:scale(1.9);opacity:0}}
@keyframes dkGlowHalf{0%{transform:scale(1);opacity:.09}100%{transform:scale(1.9);opacity:0}}
@keyframes dkWave{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes dkShim{0%{transform:translateX(-70%)}100%{transform:translateX(240%)}}
@keyframes dkDot{0%,100%{opacity:.25}50%{opacity:1}}</style></helmet>
<div style="height:392px;width:402px;box-sizing:border-box;background:#0C0C0C;border-top:1px solid rgba(255,255,255,0.08);padding:12px 20px 40px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;font-family:'Albert Sans',sans-serif">

<div style="display:flex;align-items:center;justify-content:space-between;height:36px;flex:none">
<div style="width:44px;height:36px;border-radius:10px;background:#161616;display:grid;place-items:center">
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="rgba(241,243,236,0.60)" stroke-width="1.7"><circle cx="12" cy="12" r="9"></circle><line x1="3" y1="12" x2="21" y2="12"></line><path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"></path></svg>
</div>
<div style="border-radius:22px;padding:7px 13px;background:#161616;font:600 12px/1 'Albert Sans',sans-serif;letter-spacing:.02em;color:rgba(241,243,236,0.60)">{{ lang }}</div>
<div style="width:36px;height:36px;border-radius:50%;background:#161616;display:grid;place-items:center">
<div style="width:5px;height:5px;border-radius:50%;background:rgba(241,243,236,0.60)"></div>
</div>
</div>

<sc-if value="{{ isIns }}" hint-placeholder-val="{{ false }}">
<div style="flex:none;height:38px;border-radius:22px;background:#161616;border:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;gap:10px;font:400 13px/1 'Albert Sans',sans-serif;color:rgba(241,243,236,0.60)">
<span style="color:#F1F3EC">↩ undo</span><span style="color:rgba(241,243,236,0.36)">·</span><span>see what you said</span>
</div>
</sc-if>

<div style="flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;position:relative">

<sc-if value="{{ showIdle }}" hint-placeholder-val="{{ true }}">
<div style="font:400 12px/1.4 'Albert Sans',sans-serif;color:rgba(241,243,236,0.36)">{{ hintText }}</div>
<div style="position:relative;width:88px;height:88px;border-radius:50%;background:#BFF54A;display:grid;place-items:center">
<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0A0B0A" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><line x1="12" y1="18" x2="12" y2="21"></line></svg>
</div>
<div style="display:flex;gap:5px;align-items:center;height:22px">
<span style="width:3px;height:8px;border-radius:2px;background:rgba(191,245,74,0.28)"></span><span style="width:3px;height:12px;border-radius:2px;background:rgba(191,245,74,0.28)"></span><span style="width:3px;height:6px;border-radius:2px;background:rgba(191,245,74,0.28)"></span><span style="width:3px;height:14px;border-radius:2px;background:rgba(191,245,74,0.28)"></span><span style="width:3px;height:9px;border-radius:2px;background:rgba(191,245,74,0.28)"></span><span style="width:3px;height:5px;border-radius:2px;background:rgba(191,245,74,0.28)"></span><span style="width:3px;height:11px;border-radius:2px;background:rgba(191,245,74,0.28)"></span>
</div>
</sc-if>

<sc-if value="{{ isRec }}" hint-placeholder-val="{{ false }}">
<div style="font:400 12px/1.4 'Albert Sans',sans-serif;font-variant-numeric:tabular-nums;color:#F1F3EC;letter-spacing:.04em">{{ timer }}</div>
<div style="position:relative;width:100%;display:flex;align-items:center;justify-content:center">
<div style="position:absolute;left:6px;width:40px;height:40px;border-radius:50%;background:#161616;display:grid;place-items:center">
<svg width="15" height="15" viewBox="0 0 24 24" stroke="rgba(241,243,236,0.60)" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg>
</div>
<div style="position:relative;width:88px;height:88px;display:grid;place-items:center">
<sc-if value="{{ glowFull }}" hint-placeholder-val="{{ true }}">
<div style="position:absolute;inset:0;border-radius:50%;background:#BFF54A;animation:dkGlow 2.4s ease-out infinite"></div>
<div style="position:absolute;inset:0;border-radius:50%;background:#BFF54A;animation:dkGlow 2.4s 1.2s ease-out infinite"></div>
</sc-if>
<sc-if value="{{ glowHalf }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0;border-radius:50%;background:#BFF54A;animation:dkGlowHalf 2.4s ease-out infinite"></div>
</sc-if>
<sc-if value="{{ glowBlue }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:-11px;border-radius:50%;border:1.5px solid #6AA8FF"></div>
</sc-if>
<div style="position:relative;width:88px;height:88px;border-radius:50%;background:#BFF54A;display:grid;place-items:center">
<div style="width:26px;height:26px;border-radius:7px;background:#000000"></div>
</div>
</div>
</div>
<div style="display:flex;gap:4px;align-items:center;height:30px">
<span style="width:3px;height:10px;border-radius:2px;background:#BFF54A;animation:dkWave .9s ease-in-out infinite"></span><span style="width:3px;height:18px;border-radius:2px;background:#BFF54A;animation:dkWave .9s .08s ease-in-out infinite"></span><span style="width:3px;height:26px;border-radius:2px;background:#BFF54A;animation:dkWave .9s .16s ease-in-out infinite"></span><span style="width:3px;height:14px;border-radius:2px;background:#BFF54A;animation:dkWave .9s .24s ease-in-out infinite"></span><span style="width:3px;height:22px;border-radius:2px;background:#BFF54A;animation:dkWave .9s .32s ease-in-out infinite"></span><span style="width:3px;height:30px;border-radius:2px;background:#BFF54A;animation:dkWave .9s .4s ease-in-out infinite"></span><span style="width:3px;height:16px;border-radius:2px;background:#BFF54A;animation:dkWave .9s .48s ease-in-out infinite"></span><span style="width:3px;height:24px;border-radius:2px;background:#BFF54A;animation:dkWave .9s .56s ease-in-out infinite"></span><span style="width:3px;height:12px;border-radius:2px;background:#BFF54A;animation:dkWave .9s .64s ease-in-out infinite"></span><span style="width:3px;height:20px;border-radius:2px;background:#BFF54A;animation:dkWave .9s .72s ease-in-out infinite"></span><span style="width:3px;height:28px;border-radius:2px;background:#BFF54A;animation:dkWave .9s .8s ease-in-out infinite"></span><span style="width:3px;height:15px;border-radius:2px;background:#BFF54A;animation:dkWave .9s .88s ease-in-out infinite"></span><span style="width:3px;height:9px;border-radius:2px;background:#BFF54A;animation:dkWave .9s .96s ease-in-out infinite"></span>
</div>
</sc-if>

<sc-if value="{{ isProc }}" hint-placeholder-val="{{ false }}">
<div style="width:88px;height:88px;border-radius:50%;background:#BFF54A;display:grid;place-items:center">
<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0A0B0A" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><line x1="12" y1="18" x2="12" y2="21"></line></svg>
</div>
<div style="width:190px;height:2px;border-radius:2px;background:rgba(241,243,236,0.10);overflow:hidden;position:relative">
<div style="position:absolute;top:0;left:0;width:70px;height:2px;border-radius:2px;background:#BFF54A;animation:dkShim 1.1s linear infinite"></div>
</div>
<div style="font:400 12px/1.4 'Albert Sans',sans-serif;color:rgba(241,243,236,0.36)">polishing…</div>
</sc-if>

</div>

<sc-if value="{{ isPanel }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:0;right:0;bottom:0;height:326px;background:#0C0C0C;border-top:1px solid rgba(255,255,255,0.08);border-radius:14px 14px 0 0;box-shadow:0 -18px 40px rgba(0,0,0,0.5);padding:16px 20px 40px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;align-items:center;justify-content:space-between">
<div style="font:600 13px/1.3 'Albert Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:rgba(241,243,236,0.36)">Language</div>
<div style="display:flex;gap:6px">
<div style="border-radius:22px;padding:6px 12px;background:#BFF54A;font:600 12px/1 'Albert Sans',sans-serif;color:#0A0B0A">English</div>
<div style="border-radius:22px;padding:6px 12px;background:#161616;font:600 12px/1 'Albert Sans',sans-serif;color:rgba(241,243,236,0.60)">Svenska</div>
<div style="border-radius:22px;padding:6px 12px;background:#161616;font:600 12px/1 'Albert Sans',sans-serif;color:rgba(241,243,236,0.60)">Auto</div>
</div>
</div>
<div style="height:1px;background:rgba(255,255,255,0.08)"></div>
<div style="display:flex;flex-direction:column;gap:9px">
<div style="font:600 13px/1.3 'Albert Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:rgba(241,243,236,0.36)">Tone</div>
<div style="display:flex;gap:6px">
<div style="flex:1;height:38px;border-radius:12px;background:#161616;border:1px solid rgba(255,255,255,0.12);display:grid;place-items:center;font:600 13px/1 'Albert Sans',sans-serif;color:#F1F3EC">Message</div>
<div style="flex:1;height:38px;border-radius:12px;background:#161616;display:grid;place-items:center;font:400 13px/1 'Albert Sans',sans-serif;color:rgba(241,243,236,0.60)">Work</div>
<div style="flex:1;height:38px;border-radius:12px;background:#161616;display:grid;place-items:center;font:400 13px/1 'Albert Sans',sans-serif;color:rgba(241,243,236,0.60)">Email</div>
<div style="flex:1;height:38px;border-radius:12px;background:#161616;display:grid;place-items:center;font:400 13px/1 'Albert Sans',sans-serif;color:rgba(241,243,236,0.60)">Note</div>
</div>
</div>
<div style="height:1px;background:rgba(255,255,255,0.08)"></div>
<div style="display:flex;align-items:center;justify-content:space-between;min-height:44px">
<div style="display:flex;flex-direction:column;gap:2px">
<div style="font:400 15px/1.3 'Albert Sans',sans-serif;color:#F1F3EC">Add “Kubernetes” to dictionary</div>
<div style="font:400 12px/1.4 'Albert Sans',sans-serif;color:rgba(241,243,236,0.36)">From your last dictation</div>
</div>
<div style="border-radius:22px;padding:8px 14px;background:#BFF54A;font:600 12px/1 'Albert Sans',sans-serif;color:#0A0B0A">Add</div>
</div>
<div style="height:1px;background:rgba(255,255,255,0.08)"></div>
<div style="display:flex;align-items:center;justify-content:space-between;min-height:48px">
<div style="display:flex;flex-direction:column;gap:3px;min-width:0">
<div style="font:400 13px/1.3 'Albert Sans',sans-serif;color:rgba(241,243,236,0.60)">Groq · Cerebras</div>
<div style="font:400 11px/1.3 ui-monospace,Menlo,monospace;color:rgba(241,243,236,0.36);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">whisper-large-v3-turbo → gpt-oss-120b</div>
</div>
<div style="border-radius:22px;padding:8px 14px;border:1px solid rgba(255,255,255,0.12);font:600 12px/1 'Albert Sans',sans-serif;color:#F1F3EC">Switch</div>
</div>
</div>
</sc-if>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:402,&quot;height&quot;:392},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;idle&quot;,&quot;recording&quot;,&quot;processing&quot;,&quot;inserted&quot;,&quot;panel&quot;],&quot;default&quot;:&quot;idle&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;glow&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;full&quot;,&quot;half&quot;,&quot;blue&quot;],&quot;default&quot;:&quot;full&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;timer&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;0:07&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;English (US)&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;talkHint&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;tap to talk&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const m = this.props.mode || 'idle';
    const g = this.props.glow || 'full';
    return {
      showIdle: m === 'idle' || m === 'panel' || m === 'inserted',
      isRec: m === 'recording',
      isProc: m === 'processing',
      isIns: m === 'inserted',
      isPanel: m === 'panel',
      glowFull: g === 'full',
      glowHalf: g === 'half',
      glowBlue: g === 'blue',
      timer: this.props.timer || '0:07',
      lang: this.props.lang || 'English (US)',
      hintText: this.props.talkHint || 'tap to talk'
    };
  }
}

</script>
</body>
</html>

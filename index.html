/* ---- LISTENING COMPREHENSION (Step 6) ---- */
let LS=null;
function listenPool(){ return Object.values(SRS).filter(c=>c.en && c.es); }
function listenAvailable(){ return listenPool().length>=4; }
function buildListenQuiz(n){
  const pool=listenPool(); if(pool.length<4) return [];
  const pick=pool.slice().sort(()=>Math.random()-0.5).slice(0,Math.min(n,pool.length));
  return pick.map(c=>{
    const others=pool.filter(x=>x.en!==c.en).sort(()=>Math.random()-0.5).slice(0,3).map(x=>x.en);
    const opts=[c.en,...others].sort(()=>Math.random()-0.5);
    return { es:c.es, en:c.en, options:opts, answer:c.en };
  });
}
function startListen(){ const q=buildListenQuiz(10); if(!q.length){ go('reviewhub'); return; } LS={ quiz:q, i:0, correct:0, picked:null, checked:false }; go('listen'); setTimeout(()=>{ const c=LS.quiz[0]; if(c) speak(c.es); }, 350); }
function renderListen(){
  if(!LS) return go('reviewhub');
  if(LS.i>=LS.quiz.length) return renderListenDone();
  const q=LS.quiz[LS.i]; const pct=Math.round(LS.i/LS.quiz.length*100);
  const opts=q.options.map((o,k)=>{
    let cls='lopt';
    if(LS.checked){ if(o===q.answer) cls+=' correct'; else if(o===LS.picked) cls+=' wrong'; }
    else if(o===LS.picked) cls+=' sel';
    return `<button class="${cls}" data-o="${esc(o)}"${LS.checked?' disabled':''}>${esc(o)}</button>`;
  }).join('');
  app.innerHTML=`<div class="topbar"><button class="xbtn" id="lsClose">×</button><div class="progress"><i style="width:${pct}%"></i></div><div class="stat count"><span class="glyph">🎧</span>${LS.i+1}/${LS.quiz.length}</div></div>
  <div class="screen">
    <p class="qtype">What did you hear?</p>
    <div class="listen-stage">
      <button class="listen-play" id="lsPlay" aria-label="Play audio">▶</button>
      <button class="listen-slow" id="lsSlow">↻ Slower</button>
    </div>
    ${LS.checked?`<div class="listen-answer"><b>${esc(q.es)}</b></div>`:''}
    <div class="lopts">${opts}</div>
  </div>
  <div id="foot"></div>`;
  document.getElementById('lsClose').onclick=()=>{ if(confirm('Leave listening practice?')){ LS=null; go('reviewhub'); } };
  document.getElementById('lsPlay').onclick=()=>speak(q.es);
  document.getElementById('lsSlow').onclick=()=>speak(q.es,.6);
  if(!LS.checked){
    document.querySelectorAll('.lopt').forEach(b=>b.onclick=()=>{
      LS.picked=b.dataset.o; LS.checked=true;
      if(LS.picked===q.answer) LS.correct++;
      renderListen();
    });
  } else {
    const ok=LS.picked===q.answer; const last=LS.i===LS.quiz.length-1;
    document.getElementById('foot').innerHTML=`<div class="feedback ${ok?'correct':'wrong'}"><div class="fh"><img class="fb-luma" src="mascot/${ok?'happy':'encourage'}.png" alt="" />${ok?'Correct!':'Not quite…'}</div><div class="fb">${ok?'¡Bien! You understood it.':`It was “${esc(q.es)}” — ${esc(q.en)}.`}</div><button class="cta ${ok?'ok':''}" id="lsCont">${last?'Finish':'Continue'}</button></div>`;
    document.getElementById('lsCont').onclick=()=>{ LS.i++; LS.picked=null; LS.checked=false; renderListen(); const nx=LS.quiz[LS.i]; if(nx) setTimeout(()=>speak(nx.es),300); };
  }
}
function renderListenDone(){
  const n=LS.correct, tot=LS.quiz.length; const pct=Math.round(n/tot*100);
  app.innerHTML=`<div class="screen completion">
    <div class="seal"><span>🎧</span></div>
    <h1 style="font-size:26px">Listening done!</h1>
    <p style="color:var(--muted)">You understood <b>${n}/${tot}</b> — ${pct}%. ${pct>=80?'Great ear! 👂':'Keep listening — it gets easier fast.'}</p>
    <button class="cta" id="lsAgain" style="margin-top:18px">Practice again</button>
    <button class="cta ghost" id="lsBack" style="margin-top:12px">Back to review</button></div>`;
  document.getElementById('lsAgain').onclick=startListen;
  document.getElementById('lsBack').onclick=()=>{ LS=null; go('reviewhub'); };
}

/* ---- PROGRESS DASHBOARD (Step 7) ---- */
function activityLast(n){
  const out=[]; const now=new Date(); now.setHours(0,0,0,0);
  for(let i=n-1;i>=0;i--){ const d=new Date(now.getTime()-i*864e5); const key=d.toDateString();
    out.push({ d, key, xp:(PROG.activity&&PROG.activity[key])||0 }); }
  return out;
}
function srsStrength(){
  const cards=Object.values(typeof SRS!=='undefined'?SRS:{});
  const b={ nw:0, learning:0, young:0, strong:0 };
  cards.forEach(c=>{ const S=c.S; if(S==null||c.reps===0) b.nw++; else if(S<7) b.learning++; else if(S<30) b.young++; else b.strong++; });
  return { total:cards.length, ...b };
}

/* ---- Web Push client (Step 2) ---- */
function urlB64ToUint8(base64){ base64=String(base64||'').trim().replace(/\s+/g,''); const pad='='.repeat((4-base64.length%4)%4); const b=(base64+pad).replace(/-/g,'+').replace(/_/g,'/'); const raw=atob(b); return Uint8Array.from([...raw].map(c=>c.charCodeAt(0))); }
function isStandalonePWA(){ return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true; }
function pushSupported(){ return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
async function currentPushSub(){ try{ const reg=await navigator.serviceWorker.ready; return await reg.pushManager.getSubscription(); }catch(e){ return null; } }
async function refreshPushUI(){
  const toggle=document.getElementById('pnToggle'), test=document.getElementById('pnTest'), cron=document.getElementById('pnCron'), msg=document.getElementById('pnMsg');
  if(!toggle) return;
  if(!pushSupported()){ toggle.disabled=true; toggle.textContent='Not supported on this browser'; msg.textContent='Tip: on iPhone, install Fluenta to your Home Screen first (Share → Add to Home Screen).'; return; }
  const sub=await currentPushSub();
  if(sub && Notification.permission==='granted'){
    toggle.textContent='Turn off reminders'; test.style.display=''; cron.style.display=''; loadCronUrl();
  } else { toggle.textContent='Enable notifications'; test.style.display='none'; cron.style.display='none'; }
}
async function togglePush(){
  const msg=document.getElementById('pnMsg'); msg.style.color='var(--muted)'; msg.textContent='';
  if(!pushSupported()){ return; }

  // Already granted? Either turn OFF (if subscribed) or (re)subscribe silently.
  if(Notification.permission==='granted'){
    const existing=await currentPushSub();
    if(existing){
      try{ const ep=existing.endpoint; await existing.unsubscribe(); await fetch('api/push_unsubscribe.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({endpoint:ep})}); }catch(e){}
      msg.style.color='var(--muted)'; msg.textContent='Reminders turned off.'; refreshPushUI(); return;
    }
    return enablePush(msg);
  }

  // Previously blocked — the browser won't re-prompt; the user must clear it in settings.
  if(Notification.permission==='denied'){
    msg.style.color='var(--red)'; msg.textContent='Notifications are blocked for this app. Turn them on in your device/browser Settings for Fluenta, then tap again.'; return;
  }

  // iOS/iPadOS only allow web push from a PWA installed to the Home Screen.
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  if(isIOS && !isStandalonePWA()){ msg.style.color='var(--amber)'; msg.textContent='On iPhone/iPad, first add Fluenta to your Home Screen (tap Share → “Add to Home Screen”), then open it from there and enable reminders.'; return; }

  // Ask for permission RIGHT NOW — this must be the first async call in the
  // click handler. Safari/iOS only show the prompt when requestPermission() is
  // reached directly from the user gesture; any earlier `await` silently drops
  // it (which is why the browser prompt never appeared before).
  let perm;
  try{ perm = await Notification.requestPermission(); }
  catch(e){ perm = Notification.permission; }
  if(perm!=='granted'){
    msg.style.color='var(--red)';
    msg.textContent = perm==='denied'
      ? 'Permission denied. Enable notifications for this app in your browser/device settings.'
      : 'Notifications weren’t enabled — tap “Enable notifications” and choose Allow.';
    refreshPushUI(); return;
  }
  return enablePush(msg);
}
// Registers this device with the server once notification permission is granted.
async function enablePush(msg){
  try{
    const kr=await fetch('api/push_public_key.php',{cache:'no-store'});
    let kj={}; try{ kj=await kr.json(); }catch(e){ throw new Error('the server didn’t return a valid key (HTTP '+kr.status+'). Make sure the app is deployed and /api runs PHP.'); }
    const key=String(kj.key||'').trim().replace(/\s+/g,'');
    if(!/^[A-Za-z0-9_-]{80,}$/.test(key)){ throw new Error(key?'the server sent a malformed key — reload and try again.':'the server didn’t return a key.'); }
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:urlB64ToUint8(key)});
    const raw=sub.toJSON();
    const r=await fetch('api/push_subscribe.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({endpoint:raw.endpoint,keys:raw.keys})});
    const j=await r.json();
    if(j.ok){ msg.style.color='var(--green)'; msg.textContent='Reminders on! Send a test to check. ✓'; }
    else { msg.style.color='var(--red)'; msg.textContent='Saved on device but the server rejected it. Try again.'; }
  }catch(e){ msg.style.color='var(--red)'; msg.textContent='Could not enable notifications: '+(e.message||'error'); }
  refreshPushUI();
}

  const msg=document.getElementById('pnMsg'); msg.style.color='var(--muted)'; msg.textContent='Sending…';

    else if(j.error==='no_subscriptions'){ msg.style.color='var(--red)'; msg.textContent='No device registered — enable notifications first.'; }
    else { msg.style.color='var(--red)'; msg.textContent='Test failed'+(j.failed?(' ('+j.failed+' device).'):'.')+' Re-enable and try again.'; }
  }catch(e){ msg.style.color='var(--red)'; msg.textContent='Could not reach the server.'; }
}

// Put a saved model into the UI: match a preset if one exists, otherwise drop
// it into the Custom… text box so any model name round-trips.
function aiSetModel(selId,val){

async function genAudio(reset){
  const btnGo=document.getElementById('gaGo'), btnAll=document.getElementById('gaAll');
  const prog=document.getElementById('gaProg'), bar=document.getElementById('gaBar'), msg=document.getElementById('gaMsg');
  const voice=document.getElementById('gaVoice').value; const ver=String(Date.now());
  btnGo.disabled=btnAll.disabled=true; prog.style.display='block'; bar.style.width='0%'; msg.style.color='var(--muted)';
  msg.textContent = reset ? 'Preparing full rebuild…' : 'Checking what needs audio…';
  let total=0, have=0, made=0, ok=true, first=true, stall=0;
  while(true){
    let j;
    const payload={ count:8, voice, ver, reset:(reset&&first)?1:0 };
    let r;
    try{ r=await fetch('api/gen_audio.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); }
    catch(e){ msg.style.color='var(--red)'; msg.textContent='Network error — check your connection, then tap the button to resume.'; ok=false; break; }
    const raw=await r.text();
    try{ j=JSON.parse(raw); }
    catch(e){ msg.style.color='var(--red)'; msg.textContent='Server error (HTTP '+r.status+') — the audio endpoint didn’t return valid data. Check that /api is deployed and PHP is enabled.'; ok=false; break; }
    if(j.error){ msg.style.color='var(--red)'; msg.textContent = j.error==='ai_not_configured'?'Add your OpenAI key above first.':(j.error==='audio_not_writable'?'The server’s audio folder isn’t writable (chmod it to 755).':'Error: '+j.error); ok=false; break; }
    first=false; total=j.total; have=j.have; made+=(j.generated||0);
    bar.style.width=(total?Math.round(have/total*100):100)+'%';
    if(j.remaining<=0) break;
    if((j.generated||0)===0){ if(++stall>=1){ msg.style.color='var(--red)'; msg.textContent='Some clips failed to generate — check your OpenAI credit, then tap to retry.'; ok=false; break; } }
    else stall=0;
    msg.textContent='Generating… '+have+' / '+total+' clips';
  }
  if(ok){
    // The server only knows built-in units/*.json — also voice any Studio
    // (custom) lessons, which live in this browser's storage.
    let customMade=0;
    if(CUSTOM.length){
      msg.style.color='var(--muted)'; msg.textContent='Voicing your studio lessons…';
      for(const cu of CUSTOM){ const res=await genCustomAudio(cu); customMade += (res&&res.generated)||0; }
    }
    await loadAudio(); bar.style.width='100%'; msg.style.color='var(--green)';
    const built = reset ? ('All '+total+' built-in clips regenerated')
      : (made>0 ? ('Added '+made+' new clip'+(made===1?'':'s')) : 'Built-in lessons already voiced');
    msg.textContent = built + (customMade>0 ? (' + '+customMade+' studio clip'+(customMade===1?'':'s')) : (CUSTOM.length?' · studio lessons already voiced':'')) + '. ✓';
  }
  btnGo.disabled=btnAll.disabled=false;
}

  const connecting = VOICE.state==='connecting';
  const turnsHtml = VOICE.turns.length
    ? VOICE.turns.map(t=>`<div class="vturn ${t.role}"><span class="vwho">${t.role==='assistant'?'Luma':'You'}</span><span class="vtxt">${esc(t.text)}</span></div>`).join('')
    : `<p class="qhint" style="text-align:center;max-width:32ch;margin:18px auto">Speak naturally in Spanish — Luma listens and replies out loud, keeping it short so you can practise a real conversation.</p>`;
  const orbCls = 'voice-orb' + (live?' live':'') + (VOICE.speaking?' speaking':'') + (connecting?' connecting':'');
  app.innerHTML=`<div class="screen withnav voice-screen">
    <div class="topbar"><button class="iconbtn" id="vback" aria-label="Back">←</button><span class="topbar-title">Voice chat</span><span style="width:34px"></span></div>
    <div class="voice-stage">
      <div class="${orbCls}"><img src="mascot/talk.png" alt="Luma" class="voice-luma"/></div>
      <p class="voice-status" id="vstatus">${esc(voiceStatus())}</p>
    </div>
    <div class="vturns" id="vturns">${turnsHtml}</div>
    <div class="voice-controls">
      ${live
        ? `<button class="voice-end" id="vtoggle">End conversation</button>`
        : `<button class="voice-start" id="vtoggle"${connecting?' disabled':''}>${connecting?'Connecting…':'🎙️ Start talking'}</button>`}
    </div>
  </div>` + bottomNav('tutor');
  const back=document.getElementById('vback'); if(back) back.onclick=()=>{ voiceStop(); go('tutor'); };
  const tg=document.getElementById('vtoggle'); if(tg) tg.onclick=()=> live ? voiceStop(true) : voiceStart();
  const vt=document.getElementById('vturns'); if(vt) vt.scrollTop=vt.scrollHeight;
  wireNav();
}
function voiceRefresh(){ if(SCREEN==='voice') renderVoice(); }

async function voiceStart(){
  if(!AUTH_ON){ VOICE.state='error'; VOICE.msg='Offline — can’t reach the server. Connect via Profile → “Sign in to sync”.'; voiceRefresh(); return; }
  if(!(navigator.mediaDevices && window.RTCPeerConnection)){ VOICE.state='error'; VOICE.msg='This browser can’t do live voice. Try Chrome or Safari.'; voiceRefresh(); return; }
  VOICE.state='connecting'; VOICE.turns=[]; VOICE.archived=false; VOICE.msg=''; voiceRefresh();
  try{
    const r = await fetch('api/realtime_session.php',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    const s = await r.json();
    if(!s || s.error){
      VOICE.state='error';
      VOICE.msg = s && s.error==='ai_not_configured'
        ? 'Luma’s voice isn’t switched on yet — add your OpenAI key in Settings.'
        : (s && s.error==='not_authenticated' ? 'Please log in again.' : 'Couldn’t start the voice session. Please try again.');
      voiceRefresh(); return;
    }
    const pc = new RTCPeerConnection();
    VOICE.pc = pc;
    // Luma's voice comes back on this audio element.
    const audio = new Audio(); audio.autoplay = true; VOICE.audio = audio;
    pc.ontrack = e => { audio.srcObject = e.streams[0]; };
    pc.onconnectionstatechange = () => {
      if(['failed','disconnected','closed'].includes(pc.connectionState) && VOICE.state==='live'){ voiceStop(); }
    };
    // Send mic. Echo cancellation is essential: without it the phone's speaker
    // playing Luma's voice leaks back into the mic, the model "hears itself",
    // and it ends up asking AND answering its own questions.
    const mic = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true } });
    VOICE.mic = mic;
    mic.getTracks().forEach(t=>pc.addTrack(t, mic));
    // Events channel (transcripts, turn state).
    const dc = pc.createDataChannel('oai-events'); VOICE.dc = dc;
    dc.onopen = () => {
      // Make sure the learner's speech is transcribed into the chat. Send the
      // shape matching whichever API version minted this session (belt-and-
      // suspenders — the server already requests transcription too).
      try{
        const stt = 'gpt-4o-mini-transcribe';
        const upd = (s.mode==='ga')
          ? { type:'session.update', session:{ audio:{ input:{ transcription:{ model:stt } } } } }
          : { type:'session.update', session:{ input_audio_transcription:{ model:stt } } };
        dc.send(JSON.stringify(upd));
      }catch(e){}
    };
    dc.onmessage = ev => { try{ voiceEvent(JSON.parse(ev.data)); }catch(e){} };
    // Offer → OpenAI → answer.
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    const sdpRes = await fetch(s.sdp_url, {
      method:'POST', body: offer.sdp,
      headers:{ 'Authorization':'Bearer '+s.token, 'Content-Type':'application/sdp' }
    });
    if(!sdpRes.ok){ throw new Error('sdp '+sdpRes.status); }
    await pc.setRemoteDescription({ type:'answer', sdp: await sdpRes.text() });
    VOICE.state='live'; voiceRefresh();
  }catch(e){
    VOICE.state='error'; VOICE.msg='Couldn’t connect the voice call. Check your connection and try again.';
    voiceCleanup(); voiceRefresh();
  }
}
function voiceEvent(m){
  const t=m.type||'';
  if(t==='input_audio_buffer.speech_started'){ VOICE.speaking=false; voiceStatusOnly(); return; }
  if(t==='output_audio_buffer.started' || t==='response.output_audio.started'){ VOICE.speaking=true; voiceStatusOnly(); return; }
  if(t==='output_audio_buffer.stopped' || t==='response.done'){ VOICE.speaking=false; voiceStatusOnly(); return; }
  // Learner's words — stream them in as they're transcribed, then finalise.
  if(t==='conversation.item.input_audio_transcription.delta'){
    const d=m.delta||''; if(!d) return;
    const last=VOICE.turns[VOICE.turns.length-1];
    if(last && last.role==='user' && last.streaming){ last.text+=d; }
    else { VOICE.turns.push({role:'user',text:d,streaming:true}); }
    voiceRefresh(); return;
  }
  if(t==='conversation.item.input_audio_transcription.completed'){
    const txt=(m.transcript||'').trim();
    const last=VOICE.turns[VOICE.turns.length-1];
    if(last && last.role==='user' && last.streaming){ last.streaming=false; if(txt) last.text=txt; }
    else if(txt){ VOICE.turns.push({role:'user',text:txt}); }
    voiceRefresh(); return;
  }
  // Luma's words (streamed).
  if(t==='response.audio_transcript.delta' || t==='response.output_audio_transcript.delta'){
    const d=m.delta||''; if(!d) return;
    const last=VOICE.turns[VOICE.turns.length-1];
    if(last && last.role==='assistant' && last.streaming){ last.text+=d; }
    else { VOICE.turns.push({role:'assistant',text:d,streaming:true}); }
    voiceRefresh(); return;
  }
  if(t==='response.audio_transcript.done' || t==='response.output_audio_transcript.done'){
    const last=VOICE.turns[VOICE.turns.length-1]; if(last&&last.streaming){ last.streaming=false; if(m.transcript) last.text=m.transcript.trim(); } voiceRefresh(); return;
  }
}
function voiceStatusOnly(){ const el=document.getElementById('vstatus'); if(el) el.textContent=voiceStatus(); const orb=document.querySelector('.voice-orb'); if(orb) orb.classList.toggle('speaking', !!VOICE.speaking); }
function voiceCleanup(){
  try{ if(VOICE.dc) VOICE.dc.close(); }catch(e){}
  try{ if(VOICE.mic) VOICE.mic.getTracks().forEach(t=>t.stop()); }catch(e){}
  try{ if(VOICE.pc) VOICE.pc.close(); }catch(e){}
  if(VOICE.audio){ try{ VOICE.audio.srcObject=null; }catch(e){} }
  VOICE.pc=VOICE.dc=VOICE.mic=VOICE.audio=null; VOICE.speaking=false;
}
// File the spoken conversation away for later review (once per conversation —
// the transcript stays on screen so it isn't saved twice).
function voiceArchive(){
  try{
    if(VOICE.turns && VOICE.turns.length && !VOICE.archived){ archiveSession('voice', VOICE.turns.map(t=>({role:t.role, content:t.text}))); VOICE.archived=true; }
  }catch(e){}
}
function voiceStop(rerender){ voiceArchive(); voiceCleanup(); if(VOICE.state!=='error') VOICE.state='idle'; if(rerender) voiceRefresh(); }

async function submitChangePw(){
  const p1=document.getElementById('cpNew').value||'', p2=document.getElementById('cpNew2').value||'';
  const err=document.getElementById('cpErr'); err.textContent='';
  if(p1.length<6){ err.textContent='Password must be at least 6 characters.'; return; }
  if(p1!==p2){ err.textContent='The passwords don\'t match.'; return; }
  const btn=document.getElementById('cpGo'); const lbl=btn.textContent; btn.disabled=true; btn.textContent='…';
  try{
    const r=await fetch('api/change_password.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p1})});
    const j=await r.json();
    if(j.authenticated && !j.must_change){ USER=j.user; enterApp(); return; }
    err.textContent=authErr(j.error);
  }catch(e){ err.textContent='Could not reach the server. Please try again.'; }
  btn.disabled=false; btn.textContent=lbl;
}

async function submitAuth(){
  const isReg=AUTH_MODE==='register';
  const username=(document.getElementById('auUser').value||'').trim();
  const password=document.getElementById('auPass').value||'';
  const errEl=document.getElementById('auErr'); errEl.textContent=''; errEl.style.color='';
  if(!username||!password){ errEl.textContent='Please enter your username and password.'; return; }
  const btn=document.getElementById('auGo'); const lbl=btn.textContent; btn.disabled=true; btn.textContent='…';
  try{
    const r=await fetch('api/'+(isReg?'register':'login')+'.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    const j=await r.json();
    if(j.authenticated){ USER=j.user; AUTH_ON=true; if(j.must_change){ go('changepw'); return; } enterApp(); return; }
    errEl.textContent=authErr(j.error);
  }catch(e){ errEl.textContent='Could not reach the server. Please try again.'; }
  btn.disabled=false; btn.textContent=lbl;
}

/* ---- auth gate + boot ---- */
async function checkAuth(){
  try{
    const r=await fetch('api/me.php',{cache:'no-store'});
    const ct=r.headers.get('content-type')||'';
    if(!ct.includes('application/json')) return 'disabled';   // no PHP backend (got HTML/404/raw source) → don't gate
    const j=await r.json();
    // Only gate on a clean auth answer. Any error (e.g. DB not configured
    // yet) → treat as disabled so the app is never locked behind a broken
    // backend; the gate activates automatically once config.php is set.
    if(!j || typeof j.authenticated!=='boolean') return 'disabled';
    AUTH_ON=true;
    if(j.authenticated){ USER=j.user; return j.must_change ? 'change' : 'ok'; }
    return 'login';
  }catch(e){ return 'disabled'; }   // backend unreachable → don't lock the learner out
}
async function enterApp(){ go('loading'); await syncPull(); PATH=await loadPath(); if(!PATH){ PATH=FALLBACK.path; } go('home'); }
(async ()=>{ go('loading'); loadAudio();
  const st=await checkAuth();
  if(st==='login'){ go('auth'); return; }
  if(st==='change'){ go('changepw'); return; }
  enterApp();
})();

/* ================= PWA: offline + install ================= */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    if(!('serviceWorker'in navigator)) return;
    // Reload once when a new service worker takes control, so a fresh deploy's
    // fetch/push logic applies immediately (fixes "stuck on old SW" on PWAs).
    let refreshing=false;
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{ if(refreshing)return; refreshing=true; location.reload(); });
    navigator.serviceWorker.register('sw.js').then(reg=>{ try{ reg.update(); }catch(e){} }).catch(()=>{});
  });
}
let DEFERRED_INSTALL=null;
const INSTALL_DISMISSED='fluenta_install_dismissed';
function showInstallChip(){
  if(document.getElementById('installChip')) return;
  if(localStorage.getItem(INSTALL_DISMISSED)==='1') return;
  const chip=el('div'); chip.id='installChip';
  chip.appendChild(el('span','ic-owl','🦉'));
  chip.appendChild(el('span','ic-txt','Install Fluenta on your home screen'));
  const add=el('button','ic-add','Install'); add.id='icAdd';
  const x=el('button','ic-x','×'); x.id='icX'; x.setAttribute('aria-label','Dismiss');
  chip.appendChild(add); chip.appendChild(x);
  document.body.appendChild(chip);
  add.onclick=async()=>{ if(!DEFERRED_INSTALL) return; DEFERRED_INSTALL.prompt(); try{ await DEFERRED_INSTALL.userChoice; }catch(e){} DEFERRED_INSTALL=null; chip.remove(); };
  x.onclick=()=>{ localStorage.setItem(INSTALL_DISMISSED,'1'); chip.remove(); };
}
window.addEventListener('beforeinstallprompt', (e)=>{ e.preventDefault(); DEFERRED_INSTALL=e; showInstallChip(); });
window.addEventListener('appinstalled', ()=>{ const c=document.getElementById('installChip'); if(c)c.remove(); DEFERRED_INSTALL=null; });
</script>

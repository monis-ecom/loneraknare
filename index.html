<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0A0E1A" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Fluenta" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icon-180.png" />
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
<title>Fluenta — Learn Spanish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E1A; --bg2:#0E1526;
    --surface:rgba(255,255,255,.05); --surface2:rgba(255,255,255,.08);
    --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
    --cyan:#22D3EE; --cyan2:#38BDF8; --blue:#3B82F6; --violet:#8B5CF6;
    --grad:linear-gradient(135deg,#22D3EE,#3B82F6);
    --text:#EAF1FB; --muted:#95A3BC; --faint:#5E6E88;
    --green:#34D399; --green-bg:rgba(52,211,153,.12);
    --red:#FB7185; --red-bg:rgba(251,113,133,.12);
    --amber:#FBBF24;
    --font-head:"Space Grotesk",system-ui,sans-serif;
    --radius:18px; --radius-sm:13px;
    --glow:0 0 0 1px var(--line), 0 12px 30px -14px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    background: var(--bg);
    color:var(--text); font-family:"DM Sans",system-ui,sans-serif; font-size:17px; line-height:1.5;
    display:flex; justify-content:center; padding:0; min-height:100dvh;}
  /* Ambient glow fixed to the viewport — scrolling never reveals a seam / page break. */
  body::before{ content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(1100px 620px at 50% -10%, rgba(34,211,238,.12), transparent 60%),
      radial-gradient(900px 520px at 100% 4%, rgba(139,92,246,.10), transparent 55%); }
  #app{width:100%; max-width:480px; min-height:100dvh; position:relative; z-index:1; display:flex; flex-direction:column;}

  .glass{background:var(--surface); border:1px solid var(--line); backdrop-filter:blur(8px);}
  .topbar{display:flex; align-items:center; gap:12px; padding:calc(16px + env(safe-area-inset-top)) 20px 14px; position:sticky; top:0; z-index:5;
    background:linear-gradient(var(--bg) 74%, rgba(10,14,26,0));}
  .stat{display:flex; align-items:center; gap:6px; font-family:"DM Mono",monospace; font-size:15px; font-weight:500;}
  .stat .glyph{font-size:17px; line-height:1;}
  .stat.count{color:var(--muted); margin-left:auto;}
  .progress{flex:1; height:10px; background:rgba(255,255,255,.07); border:1px solid var(--line); border-radius:99px; overflow:hidden;}
  .progress > i{display:block; height:100%; width:0; background:var(--grad); border-radius:99px; box-shadow:0 0 12px rgba(34,211,238,.6); transition:width .45s cubic-bezier(.4,1.2,.5,1);}
  .xbtn{border:none; background:none; color:var(--muted); font-size:24px; line-height:1; cursor:pointer; padding:0 4px; font-family:"DM Sans";}
  .ibtn{border:1px solid var(--line); background:var(--surface); color:var(--cyan); width:30px; height:30px; border-radius:50%; font-size:15px; cursor:pointer; flex:none; display:grid; place-items:center;}

  .screen{flex:1; padding:calc(8px + env(safe-area-inset-top)) 20px 28px; animation:rise .4s cubic-bezier(.2,.7,.3,1) both;}
  .topbar + .screen{padding-top:8px;}   /* topbar already cleared the notch */
  .screen.withnav{padding-bottom:96px;}
  @keyframes rise{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;}}
  .eyebrow{font-family:"DM Mono",monospace; text-transform:uppercase; letter-spacing:.16em; font-size:12px; color:var(--cyan); margin:0 0 10px;}
  h1{font-family:var(--font-head); font-weight:700; font-size:30px; line-height:1.12; margin:0 0 8px; letter-spacing:-.02em; color:var(--text);}
  h2{font-family:var(--font-head); font-weight:600; font-size:21px; margin:0 0 4px; color:var(--text);}
  p{margin:0 0 14px;}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--glow); padding:20px; margin-bottom:16px;}
  .grammar-card{position:relative; overflow:hidden;}
  .grammar-card::before{content:""; position:absolute; inset:0 0 auto 0; height:4px; background:var(--grad);}
  .verb-tag{display:inline-block; font-family:"DM Mono",monospace; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:#04121b; background:var(--cyan); padding:4px 10px; border-radius:99px; margin-bottom:12px; font-weight:500;}
  .verb-tag.estar{background:var(--violet); color:#fff;}
  .conj{display:grid; grid-template-columns:1fr 1fr; gap:6px 12px; margin:14px 0; font-size:15px;}
  .conj div{display:flex; justify-content:space-between; padding:8px 12px; background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:9px;}
  .conj div span:first-child{color:var(--muted);}
  .conj div span:last-child{font-weight:700; color:var(--cyan); font-family:"DM Mono",monospace;}
  .verb-tag.estar ~ .conj div span:last-child{color:var(--violet);}
  .ex{border-left:2px solid var(--line2); padding:2px 0 2px 12px; margin:10px 0;}
  .ex b{font-weight:700; color:#fff;} .ex .en{color:var(--muted); font-size:14px;} .ex .note{font-family:"DM Mono",monospace; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--amber);}
  .takeaway{display:flex; gap:10px; margin:9px 0; font-size:15px;} .takeaway .k{color:var(--cyan); font-weight:700;}
  .mistake{background:var(--red-bg); border:1px solid rgba(251,113,133,.25); border-radius:10px; padding:11px 13px; margin:9px 0; font-size:14.5px;}
  .mistake .w{color:var(--red); text-decoration:line-through;} .mistake .r{color:var(--green); font-weight:700;} .mistake .why{display:block; color:var(--muted); margin-top:3px; font-size:13px;}

  .cta{display:block; width:100%; border:none; cursor:pointer; font-family:"DM Sans"; font-weight:700; font-size:17px; color:#04121b;
    background:var(--grad); border-radius:var(--radius-sm); padding:16px; box-shadow:0 8px 24px -8px rgba(34,211,238,.55); transition:transform .06s, filter .1s; letter-spacing:.01em;}
  .cta:active{transform:translateY(2px); filter:brightness(1.05);}
  .cta[disabled]{opacity:.35; box-shadow:none; cursor:default; background:var(--surface2); color:var(--muted);}
  .cta.ghost{background:var(--surface); color:var(--text); box-shadow:none; border:1px solid var(--line2);}
  .cta.ok{background:linear-gradient(135deg,#34D399,#10B981); box-shadow:0 8px 24px -8px rgba(52,211,153,.5);}

  .qtype{font-family:"DM Mono",monospace; text-transform:uppercase; letter-spacing:.14em; font-size:11px; color:var(--muted); margin-bottom:14px;}
  .qtext{font-family:var(--font-head); font-size:24px; font-weight:600; line-height:1.3; margin-bottom:6px; color:#fff;}
  .qhint{color:var(--muted); font-size:14px; margin-bottom:20px;}

  .opt{display:flex; align-items:center; gap:12px; width:100%; text-align:left; cursor:pointer; background:var(--surface); border:1.5px solid var(--line); border-radius:var(--radius-sm); padding:15px 16px; margin-bottom:11px; font-size:17px; font-family:"DM Sans"; color:var(--text); transition:transform .05s, border-color .1s;}
  .opt .key{font-family:"DM Mono",monospace; font-size:13px; color:var(--muted); border:1.5px solid var(--line2); border-radius:6px; width:26px; height:26px; display:grid; place-items:center; flex:none;}
  .opt:active{transform:translateY(1px);}
  .opt.sel{border-color:var(--cyan); background:rgba(34,211,238,.10);} .opt.sel .key{border-color:var(--cyan); color:var(--cyan);}
  .opt.correct{border-color:var(--green); background:var(--green-bg);} .opt.correct .key{border-color:var(--green); color:var(--green);}
  .opt.wrong{border-color:var(--red); background:var(--red-bg);} .opt.wrong .key{border-color:var(--red); color:var(--red);}

  .answerline{min-height:56px; border-bottom:2px dashed var(--line2); display:flex; flex-wrap:wrap; gap:8px; padding:8px 2px 14px; margin-bottom:18px; align-content:flex-start;}
  .bank{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:8px;}
  .chip{font-family:"DM Sans"; font-size:16.5px; background:var(--surface2); border:1.5px solid var(--line2); border-radius:10px; padding:10px 14px; cursor:pointer; color:var(--text); transition:transform .05s;}
  .chip:active{transform:translateY(1px);}
  .chip.used{opacity:.25; pointer-events:none;}
  .answerline .chip{border-color:var(--cyan); background:rgba(34,211,238,.12); color:var(--cyan);}

  .field{width:100%; font-family:"DM Sans"; font-size:19px; padding:15px 16px; border:1.5px solid var(--line2); border-radius:var(--radius-sm); background:var(--surface); color:var(--text); margin-bottom:18px;}
  .field::placeholder{color:var(--faint);}
  .field:focus{outline:none; border-color:var(--cyan); box-shadow:0 0 0 3px rgba(34,211,238,.15);}

  .playbtn{display:flex; align-items:center; justify-content:center; gap:12px; width:100%; cursor:pointer; margin-bottom:20px; background:var(--grad); color:#04121b; border:none; border-radius:var(--radius-sm); padding:22px; font-family:"DM Sans"; font-weight:700; font-size:17px; box-shadow:0 8px 24px -8px rgba(34,211,238,.5);}
  .playbtn:active{transform:translateY(2px);} .playbtn .tri{font-size:22px;}
  .replay{display:block; margin:-6px auto 18px; background:none; border:none; color:var(--cyan); font-family:"DM Mono",monospace; font-size:13px; cursor:pointer; text-transform:uppercase; letter-spacing:.1em;}

  /* speak (pronunciation) exercise */
  .mic-wrap{display:flex; flex-direction:column; align-items:center; gap:12px; margin-top:26px;}
  .micbtn{width:96px; height:96px; border-radius:50%; border:none; cursor:pointer; background:var(--grad); color:#04121b; display:grid; place-items:center; box-shadow:0 10px 30px -8px rgba(34,211,238,.6); transition:transform .06s;}
  .micbtn .mic-ic{font-size:38px; line-height:1;}
  .micbtn:active{transform:scale(.96);}
  .micbtn.rec{background:linear-gradient(135deg,#FB7185,#EF4444); animation:micpulse 1.2s infinite;}
  @keyframes micpulse{0%{box-shadow:0 0 0 0 rgba(251,113,133,.5)} 70%{box-shadow:0 0 0 22px rgba(251,113,133,0)} 100%{box-shadow:0 0 0 0 rgba(251,113,133,0)}}
  .mic-status{color:var(--muted); font-size:14px; margin:0; text-align:center;}

  /* dialogue (conversation) exercise */
  .dscn{font-family:"DM Mono",monospace; text-transform:uppercase; letter-spacing:.1em; font-size:12px; color:var(--amber); margin-bottom:14px;}
  .dlg{display:flex; flex-direction:column; gap:10px; margin-bottom:18px;}
  .dbub{max-width:84%; padding:11px 14px; border-radius:16px;}
  .dbub .dsp{display:block; font-family:"DM Mono",monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:3px;}
  .dbub .dtx{font-size:16px; color:var(--text);}
  .dbub .den{display:block; font-size:12.5px; color:var(--muted); margin-top:3px;}
  .dbub.them{align-self:flex-start; background:var(--surface); border:1px solid var(--line); border-bottom-left-radius:5px;}
  .dbub.me{align-self:flex-end; background:rgba(34,211,238,.10); border:1px solid rgba(34,211,238,.28); border-bottom-right-radius:5px;}
  .dbub.me .dsp{color:var(--cyan);}
  .dbub.blank .dtx{color:var(--faint);}
  .dsnd{border:none; background:none; cursor:pointer; font-size:14px; padding:0 0 0 4px;}
  .dopts .opt .key{display:none;}
  .match{display:grid; grid-template-columns:1fr 1fr; gap:11px;}
  .mcol{display:flex; flex-direction:column; gap:11px;}
  .mtile{cursor:pointer; background:var(--surface); border:1.5px solid var(--line); border-radius:var(--radius-sm); padding:15px 12px; text-align:center; font-size:17px; color:var(--text); transition:transform .05s;}
  .mtile:active{transform:translateY(1px);}
  .mtile.sel{border-color:var(--cyan); background:rgba(34,211,238,.10); color:var(--cyan);}
  .mtile.done{border-color:var(--green); background:var(--green-bg); color:var(--green); opacity:.8; pointer-events:none;}
  .mtile.miss{animation:shake .3s; border-color:var(--red);}
  @keyframes shake{0%,100%{transform:none} 20%,60%{transform:translateX(-5px)} 40%,80%{transform:translateX(5px)}}

  .feedback{position:sticky; bottom:0; padding:18px 20px calc(18px + env(safe-area-inset-bottom)); border-top-left-radius:20px; border-top-right-radius:20px; animation:rise .25s ease both; backdrop-filter:blur(10px);}
  .feedback.correct{background:var(--green-bg); border-top:1px solid rgba(52,211,153,.4);}
  .feedback.wrong{background:var(--red-bg); border-top:1px solid rgba(251,113,133,.4);}
  .feedback .fh{display:flex; align-items:center; gap:8px; font-family:var(--font-head); font-weight:600; font-size:19px; margin-bottom:5px;}
  .fb-luma{width:38px; height:38px; flex:none; filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));}
  .feedback.correct .fh{color:var(--green);} .feedback.wrong .fh{color:var(--red);}
  .feedback .fb{font-size:14.5px; color:var(--text); margin-bottom:14px;}
  .actionbar{padding:18px 20px calc(18px + env(safe-area-inset-bottom));}

  /* home dashboard */
  .dash{padding:6px 4px 4px;}
  .dash-top{display:flex; align-items:center; gap:12px;}
  .dash-greet{flex:1; min-width:0;}
  .dash-luma{width:54px; height:auto; flex:none; animation:luma-float 3.2s ease-in-out infinite; filter:drop-shadow(0 5px 10px rgba(0,0,0,.45));}
  .hi{font-family:var(--font-head); font-weight:700; font-size:20px; margin:0; color:#fff; line-height:1.15;}
  .hi-sub{color:var(--muted); font-size:13.5px; margin:3px 0 0;}
  /* mascot animations */
  @keyframes luma-float{0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)}}
  @keyframes luma-celebrate{0%{transform:scale(.6); opacity:0} 55%{transform:scale(1.06)} 100%{transform:scale(1); opacity:1}}
  .luma-celebrate{position:relative; width:150px; margin:6px auto 16px;}
  .luma-celebrate img{width:150px; height:auto; display:block; filter:drop-shadow(0 14px 30px rgba(0,0,0,.5)); animation:luma-celebrate .55s cubic-bezier(.2,1.5,.4,1) both, luma-float 3.2s ease-in-out .55s infinite;}
  .luma-check{position:absolute; right:-4px; bottom:-4px; width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg,#34D399,#10B981); color:#04121b; font-size:24px; font-weight:800; display:grid; place-items:center; box-shadow:0 6px 18px -4px rgba(52,211,153,.6);}
  .lvring .lvr-n{font-family:var(--font-head); font-weight:700; font-size:22px; fill:#fff;}
  .lvring .lvr-l{font-family:"DM Mono",monospace; font-size:8px; letter-spacing:.14em; fill:var(--muted);}
  .chips{display:flex; gap:11px; margin-top:16px;}
  .chip-stat{flex:1; display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 14px;}
  .chip-stat .cs-ic{font-size:20px;}
  .chip-stat b{font-family:var(--font-head); font-weight:700; font-size:18px; display:block; line-height:1.1; color:#fff;}
  .chip-stat span{font-size:12px; color:var(--muted);}

  /* daily goal card (Step 3) */
  .goal-card{display:flex; align-items:center; gap:13px; width:100%; text-align:left; cursor:pointer; margin-top:11px;
    background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 14px;}
  .goal-card.met{border-color:rgba(52,211,153,.45); background:rgba(52,211,153,.07);}
  .goal-card:active{transform:translateY(1px);}
  .goal-ring{flex:none;}
  .goal-ring .gr-track{fill:none; stroke:var(--line2); stroke-width:4;}
  .goal-ring .gr-fill{fill:none; stroke:url(#gg); stroke:var(--cyan); stroke-width:4; stroke-linecap:round; transition:stroke-dashoffset .5s ease;}
  .goal-ring .gr-fill.met{stroke:var(--green);}
  .goal-ring .gr-emoji{font-size:15px;}
  .goal-txt{flex:1; min-width:0;}
  .goal-k{display:block; font-family:var(--font-head); font-weight:600; font-size:14px; color:#fff;}
  .goal-v{display:block; font-size:12.5px; color:var(--muted); margin:1px 0 7px;}
  .goal-bar{height:6px; border-radius:6px; background:var(--line2); overflow:hidden;}
  .goal-bar i{display:block; height:100%; background:var(--grad); border-radius:6px; transition:width .5s ease;}
  .goal-card.met .goal-bar i{background:var(--green);}
  .freeze-pill{flex:none; align-self:flex-start; font-size:12.5px; font-weight:600; color:var(--text); background:rgba(96,165,250,.14); border:1px solid rgba(96,165,250,.3); border-radius:999px; padding:3px 9px;}
  .goal-opts{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px;}
  .goal-opt{display:flex; flex-direction:column; gap:2px; align-items:flex-start; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:11px 13px; cursor:pointer; color:var(--text);}
  .goal-opt.on{border-color:var(--cyan); background:rgba(34,211,238,.1);}
  .goal-opt b{font-family:var(--font-head); font-size:16px;}
  .goal-opt span{font-size:12px; color:var(--muted);}
  .streak-note{background:rgba(96,165,250,.1); border:1px solid rgba(96,165,250,.28); border-radius:12px; padding:11px 15px; font-size:14px; color:var(--text); margin-bottom:12px;}
  .goal-hit{background:rgba(52,211,153,.1); border:1px solid rgba(52,211,153,.3); border-radius:12px; padding:11px 15px; font-size:14px; color:var(--text); margin-bottom:12px;}

  /* achievements (Step 4) */
  .ach-head{display:flex; align-items:baseline; justify-content:space-between;}
  .ach-count{font-family:"DM Mono",monospace; font-size:13px; color:var(--cyan);}
  .badges{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px;}
  .badge{display:flex; flex-direction:column; align-items:center; gap:7px; padding:14px 8px; border-radius:14px; cursor:pointer;
    background:var(--surface); border:1px solid var(--line); color:var(--text); text-align:center;}
  .badge.got{background:linear-gradient(160deg,rgba(34,211,238,.12),rgba(139,92,246,.1)); border-color:rgba(34,211,238,.4);}
  .badge.locked{opacity:.5;}
  .badge:active{transform:translateY(1px);}
  .badge-ic{font-size:28px; line-height:1;}
  .badge.locked .badge-ic{filter:grayscale(1);}
  .badge-t{font-size:11px; line-height:1.2; color:var(--muted);}
  .badge.got .badge-t{color:var(--text);}
  .ach-unlocks{display:flex; flex-direction:column; gap:8px; margin-bottom:12px;}
  .ach-unlock{display:flex; align-items:center; gap:12px; background:linear-gradient(160deg,rgba(34,211,238,.14),rgba(139,92,246,.12)); border:1px solid rgba(34,211,238,.4); border-radius:12px; padding:11px 15px; text-align:left; animation:rise .4s ease both;}
  .ach-unlock .au-ic{font-size:26px; line-height:1; flex:none;}
  .ach-unlock .au-tx{display:flex; flex-direction:column;}
  .ach-unlock .au-tx b{font-family:"DM Mono",monospace; text-transform:uppercase; letter-spacing:.1em; font-size:10px; color:var(--cyan);}
  .ach-unlock .au-tx span{font-family:var(--font-head); font-size:15px; color:#fff;}

  /* shared topbar back button + title (voice + dashboard) */
  .iconbtn{width:34px; height:34px; flex:none; border:1px solid var(--line2); background:var(--surface); color:var(--text); border-radius:10px; font-size:18px; cursor:pointer; line-height:1;}
  .iconbtn:active{transform:translateY(1px);}
  .topbar-title{flex:1; text-align:center; font-family:var(--font-head); font-weight:600; font-size:16px;}

  /* progress dashboard (Step 7) */
  .dash-hero{display:flex; align-items:center; gap:16px; margin-top:6px;}
  .dh-tx{display:flex; flex-direction:column;}
  .dh-lv{font-family:var(--font-head); font-size:22px; font-weight:700;}
  .dh-xp{font-size:13px; color:var(--muted); margin-top:2px;}
  .d-sec{margin-top:22px;}
  .d-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px;}
  .d-head h2{font-size:17px;}
  .d-sub{font-family:"DM Mono",monospace; font-size:12px; color:var(--muted);}
  .actchart{position:relative; display:flex; align-items:flex-end; gap:5px; height:104px; padding-top:4px;}
  .actchart::before{content:""; position:absolute; left:0; right:0; bottom:calc(var(--goal,50%) * .84); height:1px; background:repeating-linear-gradient(90deg,rgba(52,211,153,.5) 0 6px,transparent 6px 12px);}
  .ac-col{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; height:100%;}
  .ac-bar{flex:1; width:100%; display:flex; align-items:flex-end; border-radius:6px; overflow:hidden;}
  .ac-bar i{display:block; width:100%; background:var(--grad); border-radius:6px 6px 0 0; min-height:2px;}
  .ac-d{font-size:10px; color:var(--faint);}
  .dl-row{display:flex; align-items:center; gap:10px; margin-bottom:9px;}
  .dl-k{width:26px; font-family:"DM Mono",monospace; font-size:12px; color:var(--cyan);}
  .dl-bar{flex:1; height:8px; border-radius:8px; background:var(--line2); overflow:hidden;}
  .dl-bar i{display:block; height:100%; background:var(--grad); border-radius:8px;}
  .dl-n{width:44px; text-align:right; font-size:12px; color:var(--muted);}
  .d-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:22px;}
  .d-mini{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 10px; text-align:center;}
  .d-mini b{display:block; font-family:var(--font-head); font-size:22px; color:#fff; line-height:1;}
  .d-mini span{font-size:11px; color:var(--muted); margin-top:5px; display:block;}
  .seg{display:flex; height:12px; border-radius:6px; overflow:hidden; gap:2px;}
  .seg i{display:block;}
  .seg-nw{background:#3b4256;} .seg-le{background:#3B82F6;} .seg-yo{background:#22D3EE;} .seg-st{background:#34D399;}
  .seg-key{display:flex; flex-wrap:wrap; gap:10px 16px; margin-top:10px; font-size:12px; color:var(--muted);}
  .seg-key span{display:flex; align-items:center; gap:6px;}
  .seg-key b{width:10px; height:10px; border-radius:3px; display:inline-block;}
  .k-nw{background:#3b4256;} .k-le{background:#3B82F6;} .k-yo{background:#22D3EE;} .k-st{background:#34D399;}

  /* weak-spots review card (Step 5) */
  .weakspot-card{display:flex; align-items:center; gap:13px; width:100%; text-align:left; cursor:pointer; margin-top:14px;
    background:linear-gradient(160deg,rgba(139,92,246,.14),rgba(34,211,238,.08)); border:1px solid rgba(139,92,246,.4); border-radius:16px; padding:15px 16px; color:var(--text);}
  .weakspot-card:active{transform:translateY(1px);}
  .weakspot-card .ws-ic{font-size:26px; flex:none;}
  .weakspot-card .ws-tx{flex:1; display:flex; flex-direction:column;}
  .weakspot-card .ws-tx b{font-family:var(--font-head); font-size:16px;}
  .weakspot-card .ws-tx span{font-size:13px; color:var(--muted); margin-top:2px;}
  .weakspot-card .ws-go{font-size:20px; color:var(--violet); flex:none;}

  /* vocabulary browser (Step 8) */
  .browse-link{display:block; width:100%; text-align:center; margin-top:14px; background:none; border:none; cursor:pointer; color:var(--cyan); font-family:"DM Sans"; font-size:14px; font-weight:600; padding:8px;}
  .vchips{display:flex; gap:8px; overflow-x:auto; padding:4px 0 2px; margin-bottom:8px; -webkit-overflow-scrolling:touch;}
  .vchip{flex:none; background:var(--surface); border:1px solid var(--line); color:var(--muted); border-radius:999px; padding:6px 13px; font-family:"DM Sans"; font-size:13px; cursor:pointer;}
  .vchip.on{background:rgba(34,211,238,.14); border-color:var(--cyan); color:var(--cyan);}
  .vcount{font-family:"DM Mono",monospace; font-size:12px; color:var(--faint); margin:2px 0 10px;}
  .vlist{display:flex; flex-direction:column; gap:8px;}
  .vrow{display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:11px 13px;}
  .vrow-audio{flex:none; width:38px; height:38px; border-radius:50%; border:1px solid var(--line2); background:var(--bg2); color:var(--cyan); font-size:16px; cursor:pointer;}
  .vrow-audio:active{transform:scale(.94);}
  .vrow-tx{flex:1; min-width:0;}
  .vrow-tx b{display:block; font-size:16px; color:#fff;}
  .vrow-tx span{display:block; font-size:13px; color:var(--muted); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .vstr{flex:none; font-family:"DM Mono",monospace; font-size:10px; text-transform:uppercase; letter-spacing:.08em; border:1px solid; border-radius:999px; padding:3px 8px; opacity:.9;}

  /* grammar reference hub (Step 9) */
  .ref-list{display:flex; flex-direction:column; gap:8px;}
  .ref-chap{font-family:"DM Mono",monospace; text-transform:uppercase; letter-spacing:.1em; font-size:11px; color:var(--cyan); margin:16px 0 4px;}
  .ref-row{display:flex; align-items:center; gap:12px; width:100%; text-align:left; cursor:pointer; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 13px; color:var(--text);}
  .ref-row:active{transform:translateY(1px);}
  .ref-ic{font-size:22px; flex:none;}
  .ref-tx{flex:1; min-width:0;}
  .ref-tx b{display:block; font-size:15px;}
  .ref-tx span{display:block; font-size:12.5px; color:var(--muted); margin-top:1px;}
  .ref-go{color:var(--faint); font-size:18px; flex:none;}
  .ref-done{color:var(--green); font-size:15px; flex:none; font-weight:700;}

  /* listening comprehension (Step 6) */
  .listen-card .ws-go{color:var(--cyan);}
  .listen-stage{display:flex; flex-direction:column; align-items:center; gap:12px; margin:18px 0 20px;}
  .listen-play{width:96px; height:96px; border-radius:50%; border:none; cursor:pointer; background:var(--grad); color:#04121b; font-size:34px; box-shadow:0 10px 30px -8px rgba(34,211,238,.6);}
  .listen-play:active{transform:scale(.96);}
  .listen-slow{background:var(--surface); border:1px solid var(--line2); color:var(--muted); border-radius:999px; padding:8px 16px; font-family:"DM Sans"; font-size:14px; cursor:pointer;}
  .listen-answer{text-align:center; font-size:20px; color:#fff; margin-bottom:16px;}
  .lopts{display:flex; flex-direction:column; gap:10px;}
  .lopt{width:100%; text-align:left; background:var(--surface); border:1.5px solid var(--line2); color:var(--text); border-radius:12px; padding:14px 16px; font-family:"DM Sans"; font-size:16px; cursor:pointer;}
  .lopt.sel{border-color:var(--cyan); background:rgba(34,211,238,.1);}
  .lopt.correct{border-color:var(--green); background:rgba(52,211,153,.14); color:#fff;}
  .lopt.wrong{border-color:var(--red); background:rgba(251,113,133,.14);}
  .lopt:disabled{cursor:default;}

  /* lesson studio (Step 10) */
  .studio-list{display:flex; flex-direction:column; gap:9px;}
  .studio-row{display:flex; align-items:stretch; gap:8px;}
  .sr-play{flex:1; display:flex; align-items:center; gap:12px; text-align:left; cursor:pointer; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 13px; color:var(--text);}
  .sr-play:active{transform:translateY(1px);}
  .sr-ic{width:34px; height:34px; flex:none; display:flex; align-items:center; justify-content:center; border-radius:50%; background:var(--grad); color:#04121b; font-size:15px;}
  .sr-tx{min-width:0;} .sr-tx b{display:block; font-size:15px;} .sr-tx span{display:block; font-size:12px; color:var(--muted); margin-top:1px;}
  .sr-del{flex:none; width:44px; border:1px solid var(--line); background:var(--surface); border-radius:12px; color:var(--muted); font-size:16px; cursor:pointer;}
  .sr-audio{flex:none; width:44px; border:1px solid var(--line); background:var(--surface); border-radius:12px; color:var(--cyan); font-size:16px; cursor:pointer;}
  .sr-audio:disabled{opacity:.6;}
  .ed-row{display:flex; gap:8px; align-items:center; margin-bottom:9px;}
  .ed-row .field{margin-bottom:0; flex:1; font-size:16px; padding:12px 13px;}
  .ed-x{flex:none; width:38px; height:44px; border:1px solid var(--line); background:var(--surface); border-radius:10px; color:var(--muted); font-size:20px; cursor:pointer;}

  /* push cron url (Step 2) */
  .cron-url{font-family:"DM Mono",monospace; font-size:12px; color:var(--cyan); background:var(--bg2); border:1px solid var(--line2); border-radius:10px; padding:10px 12px; word-break:break-all; line-height:1.5;}

  /* featured "continue" card */
  .feat{display:flex; align-items:center; gap:14px; width:100%; text-align:left; cursor:pointer; margin:18px 0 4px;
    background:linear-gradient(135deg, rgba(34,211,238,.14), rgba(59,130,246,.10)); border:1px solid rgba(34,211,238,.3);
    border-radius:var(--radius); padding:16px; box-shadow:0 10px 30px -16px rgba(34,211,238,.6);}
  .feat:active{transform:translateY(1px);}
  .feat-ic{font-size:30px; width:52px; height:52px; border-radius:14px; background:var(--surface2); display:grid; place-items:center; flex:none;}
  .feat-txt{flex:1; display:flex; flex-direction:column; gap:1px;}
  .feat-k{font-family:"DM Mono",monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.14em; color:var(--cyan);}
  .feat-t{font-family:var(--font-head); font-weight:600; font-size:18px; color:#fff;}
  .feat-s{font-size:13px; color:var(--muted);}
  .feat-arrow{font-size:20px; color:var(--cyan); flex:none;}

  .path{display:flex; flex-direction:column; align-items:center; gap:20px; padding:18px 0 40px; position:relative;}
  .node{display:flex; flex-direction:column; align-items:center; gap:8px; position:relative; z-index:1; transition:transform .45s cubic-bezier(.34,1.35,.5,1); will-change:transform;}
  .path-mascot{position:absolute; top:4px; width:52px; height:auto; margin-left:-26px; pointer-events:none; user-select:none; z-index:0; opacity:.92; filter:drop-shadow(0 7px 12px rgba(0,0,0,.5)); animation:luma-float 4.8s ease-in-out infinite;}
  @media (prefers-reduced-motion: reduce){ .path-mascot{animation:none;} }
  .medallion{width:72px; height:72px; border-radius:20px; display:grid; place-items:center; font-size:29px; transform:rotate(45deg); border:1.5px solid var(--line); background:var(--surface);}
  .medallion > span{transform:rotate(-45deg);}
  .node.done .medallion{background:var(--grad); border-color:transparent; color:#04121b; cursor:pointer; box-shadow:0 8px 24px -10px rgba(34,211,238,.6);}
  .node.active .medallion{background:rgba(34,211,238,.14); border-color:var(--cyan); color:var(--cyan); box-shadow:0 0 0 5px rgba(34,211,238,.14), 0 0 26px rgba(34,211,238,.5); cursor:pointer; animation:pulse 2.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 5px rgba(34,211,238,.12), 0 0 20px rgba(34,211,238,.35);} 50%{box-shadow:0 0 0 7px rgba(34,211,238,.16), 0 0 30px rgba(34,211,238,.6);}}
  .node.locked .medallion, .node.soon .medallion{opacity:.4;}
  .node .lbl{font-family:"DM Mono",monospace; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); text-align:center;}
  .node.active .lbl{color:var(--cyan); font-weight:500;}
  .connector{width:3px; height:26px; background:var(--line2); border-radius:2px;}
  .connector.done{background:var(--cyan); box-shadow:0 0 8px rgba(34,211,238,.5);}
  .chapter-head{display:flex; flex-direction:column; align-items:center; gap:8px; margin:28px 0 16px; text-align:center;}
  .chapter-head:first-child{margin-top:6px;}
  .ch-rule{display:flex; align-items:center; gap:12px; width:100%;}
  .ch-rule::before,.ch-rule::after{content:""; flex:1; height:1px;}
  .ch-rule::before{background:linear-gradient(90deg, transparent, var(--line2));}
  .ch-rule::after{background:linear-gradient(90deg, var(--line2), transparent);}
  .ch-badge{font-family:"DM Mono",monospace; text-transform:uppercase; letter-spacing:.14em; font-size:11px; color:var(--amber);
    border:1px solid rgba(251,191,36,.35); background:rgba(251,191,36,.08); padding:5px 13px; border-radius:99px; white-space:nowrap;}
  .chapter-head .ch-t{font-family:var(--font-head); font-weight:600; font-size:19px; color:var(--text);}

  .completion{text-align:center; padding-top:20px;}
  .seal{width:112px; height:112px; margin:8px auto 18px; border-radius:30px; transform:rotate(45deg); background:var(--grad); display:grid; place-items:center; box-shadow:0 0 0 6px rgba(34,211,238,.12), 0 16px 40px -12px rgba(34,211,238,.6); animation:pop .5s cubic-bezier(.2,1.5,.4,1) both;}
  .seal > span{transform:rotate(-45deg); font-size:50px;}
  @keyframes pop{from{transform:rotate(45deg) scale(.5); opacity:0;} to{transform:rotate(45deg) scale(1); opacity:1;}}
  .tally{display:flex; justify-content:center; gap:11px; margin:22px 0;}
  .tallycard{flex:1; max-width:130px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:15px 8px;}
  .tallycard .n{font-family:var(--font-head); font-weight:700; font-size:29px; line-height:1;}
  .tallycard .l{font-family:"DM Mono",monospace; font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin-top:5px;}
  .tallycard.xp .n{color:var(--cyan);} .tallycard.streak .n{color:var(--amber);} .tallycard.mastery .n{color:var(--green);}
  .review-note{background:rgba(34,211,238,.08); border:1px solid var(--line); border-radius:12px; padding:13px 16px; font-size:14.5px; margin-bottom:20px; text-align:left; display:flex; gap:10px; color:var(--muted);}
  .review-note b{color:var(--text);}

  .center{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 28px;}
  .spinner{width:38px; height:38px; border:4px solid var(--line2); border-top-color:var(--cyan); border-radius:50%; animation:spin .8s linear infinite; margin-bottom:16px;}
  @keyframes spin{to{transform:rotate(360deg)}}
  code{font-family:"DM Mono",monospace; background:var(--surface2); border:1px solid var(--line); border-radius:6px; padding:2px 7px; font-size:14px; color:var(--cyan);}

  /* review */
  .review-banner{display:flex; align-items:center; gap:12px; width:100%; text-align:left; cursor:pointer; margin-bottom:6px;
    background:linear-gradient(135deg, rgba(139,92,246,.14), rgba(34,211,238,.08)); border:1px solid rgba(139,92,246,.32); border-radius:14px; padding:14px 16px; font-family:"DM Sans";}
  .review-banner:active{transform:translateY(1px);}
  .review-banner .rb-ic{font-size:22px; line-height:1; flex:none;}
  .review-banner .rb-txt{flex:1; color:var(--text); font-size:15px;}
  .review-banner .rb-txt b{font-family:"DM Mono",monospace; color:var(--violet);}
  .review-banner .rb-go{flex:none; font-family:"DM Mono",monospace; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--violet); font-weight:500;}
  .review-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--glow); padding:34px 20px; margin:10px 0 18px; text-align:center;}
  .review-card .rv-label{font-family:"DM Mono",monospace; text-transform:uppercase; letter-spacing:.12em; font-size:11px; color:var(--muted); margin:0 0 14px;}
  .review-card .rv-front{font-family:var(--font-head); font-weight:600; font-size:30px; line-height:1.2; color:#fff;}
  .review-card .rv-back{font-family:var(--font-head); font-weight:700; font-size:32px; line-height:1.2; color:var(--cyan); display:flex; align-items:center; justify-content:center; gap:10px;}
  .review-card.revealed{border-color:rgba(34,211,238,.32); background:rgba(34,211,238,.07);}
  .rv-audio{border:none; background:none; cursor:pointer; font-size:22px; line-height:1; padding:0;}
  .rv-hint{text-align:center; color:var(--muted); font-size:14px; margin:0 0 12px;}
  .rates{display:grid; grid-template-columns:1fr 1fr; gap:11px;}
  .rate{display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; border:1.5px solid var(--line); border-radius:var(--radius-sm);
    background:var(--surface); padding:14px 10px; font-family:"DM Sans"; transition:transform .05s;}
  .rate:active{transform:translateY(1px);}
  .rate .rl{font-weight:700; font-size:16px;}
  .rate .ri{font-family:"DM Mono",monospace; font-size:11.5px; color:var(--muted);}
  .rate1{border-color:rgba(251,113,133,.4);} .rate1 .rl{color:var(--red);}
  .rate2{border-color:rgba(251,191,36,.4);} .rate2 .rl{color:var(--amber);}
  .rate3{border-color:rgba(56,189,248,.4);} .rate3 .rl{color:var(--cyan2);}
  .rate4{border-color:rgba(52,211,153,.4);} .rate4 .rl{color:var(--green);}

  /* profile */
  .prow{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:18px 0;}
  .pcard{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px 16px; text-align:center;}
  .pcard b{font-family:var(--font-head); font-weight:700; font-size:26px; color:#fff; display:block;}
  .pcard span{font-size:12.5px; color:var(--muted); margin-top:4px; display:block;}
  .set-lbl{font-family:"DM Mono",monospace; text-transform:uppercase; letter-spacing:.12em; font-size:11px; color:var(--muted); margin:0 0 4px;}
  .set-val{font-size:15px; color:var(--text); margin:0;}
  .set-msg{font-size:13px; margin:8px 0 0; min-height:16px;}
  .ga-prog{margin-top:12px;}
  .ga-bar{height:8px; background:rgba(255,255,255,.08); border:1px solid var(--line); border-radius:99px; overflow:hidden;}
  .ga-bar > i{display:block; height:100%; width:0; background:var(--grad); border-radius:99px; transition:width .3s;}

  /* auth screen */
  .authscreen{display:flex; flex-direction:column; justify-content:center; min-height:100dvh; padding:18px 22px 24px;}
  .auth-brand{text-align:center; margin-bottom:18px;}
  .auth-hero{width:70%; max-width:280px; height:auto; display:block; margin:0 auto -8px;
    -webkit-mask-image:radial-gradient(ellipse 60% 60% at 50% 45%,#000 50%,transparent 80%);
    mask-image:radial-gradient(ellipse 60% 60% at 50% 45%,#000 50%,transparent 80%);
    filter:drop-shadow(0 0 30px rgba(52,211,153,.22)) drop-shadow(0 16px 42px rgba(34,211,238,.28));}
  .auth-logo{font-family:var(--font-head); font-weight:700; font-size:40px; line-height:1.02; margin:4px 0 6px; letter-spacing:-.03em;
    background:linear-gradient(180deg,#ffffff 0%,#bfe6ff 90%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
  .auth-tag{color:var(--muted); font-size:15px; margin:0;}
  .auth-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px 16px 20px; box-shadow:var(--glow);}
  .authscreen .field{margin-bottom:0;}
  /* icon input group */
  .ig{position:relative; margin-bottom:12px;}
  .ig .ico{position:absolute; left:15px; top:50%; transform:translateY(-50%); color:var(--cyan); display:grid; place-items:center; pointer-events:none;}
  .ig .field{padding-left:46px;}
  .ig .field.haspw{padding-right:48px;}
  .ig .eye{position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--faint); cursor:pointer; padding:8px; display:grid; place-items:center; border-radius:8px;}
  .ig .eye:hover{color:var(--cyan);}
  .ig .eye .e-off{display:none;}
  .ig .eye.on .e-on{display:none;} .ig .eye.on .e-off{display:grid;}
  .auth-forgot{display:block; margin:10px 2px 0 auto; background:none; border:none; cursor:pointer; color:var(--cyan2); font-family:"DM Sans"; font-weight:600; font-size:13.5px; text-align:right;}
  .auth-err{color:var(--red); font-size:13.5px; min-height:18px; margin:8px 2px 4px; text-align:center;}
  .authscreen .cta{margin-top:6px;}
  .auth-or{display:flex; align-items:center; gap:14px; color:var(--faint); font-family:"DM Mono",monospace; font-size:12px; letter-spacing:.18em; margin:20px 4px;}
  .auth-or::before,.auth-or::after{content:""; flex:1; height:1px; background:var(--line2);}
  .auth-alt{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; cursor:pointer; font-family:"DM Sans"; font-weight:700; font-size:16px; color:var(--text);
    background:rgba(56,189,248,.05); border:1.5px solid rgba(56,189,248,.42); border-radius:var(--radius-sm); padding:15px; box-shadow:0 10px 34px -18px rgba(56,189,248,.7); transition:transform .06s, border-color .12s, background .12s;}
  .auth-alt .ai{color:var(--cyan); display:grid; place-items:center;}
  .auth-alt:hover{border-color:rgba(56,189,248,.7); background:rgba(56,189,248,.09);}
  .auth-alt:active{transform:translateY(1px);}
  .auth-foot{display:flex; align-items:center; justify-content:center; gap:8px; text-align:center; color:var(--faint); font-size:13px; margin-top:18px;}
  .auth-foot .shield{color:var(--green); flex:none; display:grid; place-items:center;}

  /* AI tutor chat — full-height column, input pinned to the bottom */
  .tutor-screen{display:flex; flex-direction:column; height:100dvh; padding-top:calc(8px + env(safe-area-inset-top)); padding-bottom:0;}
  .tlist{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:12px; padding:6px 2px 10px; min-height:0;}
  .tutor-intro{margin:auto; text-align:center; padding:16px 0;}
  .tutor-owl{width:126px; height:auto; filter:drop-shadow(0 10px 22px rgba(0,0,0,.45)); margin-bottom:4px; animation:luma-float 3.4s ease-in-out infinite;}
  .tchips{display:flex; flex-direction:column; gap:8px; max-width:320px; margin:0 auto;}
  .tchip{background:var(--surface); border:1px solid var(--line); color:var(--text); border-radius:12px; padding:11px 14px; font-family:"DM Sans"; font-size:14px; cursor:pointer; text-align:left;}
  .tchip:active{transform:translateY(1px);}
  .lvl-chip{background:var(--surface); border:1px solid var(--line); color:var(--muted); border-radius:10px; padding:8px 13px; font-family:"DM Mono",monospace; font-size:13px; letter-spacing:.04em; cursor:pointer;}
  .lvl-chip.on{background:rgba(34,211,238,.14); border-color:var(--cyan); color:var(--cyan);}

/* ---- helpers ---- */

/* ---- unlock state machine ---- */
function stateOf(i){
  const u=PATH[i];
  if(!u.ready) return 'soon';
  if(PROG.completed.includes(u.id)) return 'done';
  let prev=null; for(let j=i-1;j>=0;j--){ if(PATH[j].ready){ prev=PATH[j]; break; } }

/* ---- streak (once per calendar day) with streak-freeze protection ---- */
function bumpStreak(){
  const todayStr=new Date().toDateString();
  PROG._streakEvent=null;
  if(PROG.lastDay===todayStr) return;                 // already counted today
  const dn = s => Math.floor(new Date(s).getTime()/864e5);
  const today = dn(todayStr);
  const last  = PROG.lastDay ? dn(PROG.lastDay) : null;
  if(last==null){ PROG.streak=1; PROG._streakEvent='start'; }
  else {
    const missed = (today - last) - 1;                // full days skipped
    if(missed<=0){ PROG.streak=(PROG.streak||0)+1; PROG._streakEvent='up'; }
    else if((PROG.freezes||0) >= missed){              // freeze bridges the gap
      PROG.freezes-=missed; PROG.streak=(PROG.streak||0)+1; PROG._streakEvent='freeze'; PROG._streakFroze=missed;
    } else { PROG.streak=1; PROG._streakEvent='reset'; }
  }
  PROG.lastDay=todayStr;
  if(PROG.streak>(PROG.maxStreak||0)) PROG.maxStreak=PROG.streak;   // best-ever, for achievements
  // weekly reward: earn a freeze every 7 days of streak (capped)
  if(PROG.streak>0 && PROG.streak%7===0 && (PROG.freezes||0)<MAX_FREEZES){ PROG.freezes=(PROG.freezes||0)+1; PROG._streakEvent=(PROG._streakEvent||'up')+'+freezeEarned'; }
}

/* ================= SPACED REPETITION (FSRS-4.5) =================
   Real scheduler: each vocab card tracks stability (S) + difficulty (D).
   Grades: 1=Again 2=Hard 3=Good 4=Easy. Dates are integer day-numbers. */
const FSRS = (function(){
  const w = [0.4872,1.4003,3.7145,13.8206,5.1618,1.2298,0.8975,0.031,1.6474,0.1367,1.0461,2.1072,0.0793,0.3246,1.587,0.2272,2.8755];
  const DECAY=-0.5, FACTOR=Math.pow(0.9,1/DECAY)-1, R_REQ=0.9, MIN_S=0.1, MIN_I=1, MAX_I=3650;
  const clampD=d=>Math.min(10,Math.max(1,d));
  const initD=g=>clampD(w[4]-(g-3)*w[5]);
  const initS=g=>Math.max(MIN_S,w[g-1]);
  const retr=(t,S)=>Math.pow(1+FACTOR*Math.max(0,t)/S,DECAY);
  const interval=S=>Math.min(MAX_I,Math.max(MIN_I,Math.round(S/FACTOR*(Math.pow(R_REQ,1/DECAY)-1))));
  const nextD=(D,g)=>{ const d1=D-w[6]*(g-3); return clampD(w[7]*initD(3)+(1-w[7])*d1); };
  function nextS(S,D,R,g){
    if(g===1){ const sf=w[11]*Math.pow(D,-w[12])*(Math.pow(S+1,w[13])-1)*Math.exp(w[14]*(1-R)); return Math.max(MIN_S,Math.min(sf,S)); }
    const hard=g===2?w[15]:1, easy=g===4?w[16]:1;
    const inc=Math.exp(w[8])*(11-D)*Math.pow(S,-w[9])*(Math.exp(w[10]*(1-R))-1)*hard*easy;
    return Math.max(MIN_S,S*(1+inc));
  }
  function first(g){ const S=initS(g),D=initD(g); return {S,D,interval:interval(S)}; }
  function review(card,g,elapsed){ const R=retr(elapsed,card.S); const S=nextS(card.S,card.D,R,g); return {S,D:nextD(card.D,g),interval:interval(S)}; }
  return { first, review };
})();

const todayNum = ()=> Math.floor(Date.now()/864e5);
function loadSRS(){ try{ const s=JSON.parse(localStorage.getItem('fluenta_srs')||'null'); if(s&&typeof s==='object') return s; }catch(e){} return {}; }
function saveSRS(){ try{ localStorage.setItem('fluenta_srs', JSON.stringify(SRS)); }catch(e){} syncPush(); }
const SRS = loadSRS();
function cardId(unitId,es){ return unitId+'::'+es; }

function seedVocab(unit){
  const list = (unit.vocab && unit.vocab.length) ? unit.vocab
             : ((unit.completion&&unit.completion.adds_vocab_to_srs)||[]).map(es=>({es,en:''}));
  let added=0;
  list.forEach(v=>{ const id=cardId(unit.unit.id,v.es); if(!SRS[id]){ SRS[id]={es:v.es,en:v.en||'',unit:unit.unit.id,S:null,D:null,due:todayNum(),last:null,reps:0,lapses:0}; added++; } });
  if(added) saveSRS();
  return added;
}
function dueCards(){ const t=todayNum(); return Object.keys(SRS).map(k=>SRS[k]).filter(c=>c.due<=t); }
function previewInterval(card,g){
  if(card.S==null) return FSRS.first(g).interval;
  const elapsed=(card.last!=null)?(todayNum()-card.last):card.S;
  return FSRS.review({S:card.S,D:card.D},g,elapsed).interval;
}
function gradeCard(card,g){
  const t=todayNum();
  const res = (card.S==null) ? FSRS.first(g)
            : FSRS.review({S:card.S,D:card.D}, g, (card.last!=null)?(t-card.last):card.S);
  card.S=res.S; card.D=res.D; card.last=t; card.due=t+res.interval;
  card.reps=(card.reps||0)+1; if(g===1) card.lapses=(card.lapses||0)+1;
  saveSRS(); return res.interval;
}
function fmtInterval(days){ if(days<=0) return 'soon'; if(days===1) return '1 day'; if(days<30) return days+' days'; if(days<365){ const m=Math.round(days/30); return m+(m===1?' month':' months'); } const y=Math.round(days/365); return y+(y===1?' year':' years'); }

/* ---- Weak spots (Step 5): drill the words you struggle with most ----
   Scored from your own FSRS history: lapses (times forgotten), difficulty,
   and low stability despite repeated reviews. Doesn't wait for cards to be
   due — it targets what's actually shaky, and grading still feeds FSRS. */
function cardWeakness(c){
  const S=c.S, D=(c.D!=null?c.D:5), lap=c.lapses||0, reps=c.reps||0;
  let s = lap*3 + (D-5)*0.6;
  if(S!=null && reps>=2 && S<4) s += 2;   // reviewed a few times but still fragile
  if(S!=null && S<2) s += 1;              // very short retention
  return s;
}
function weakCards(limit){
  limit=limit||15;
  return Object.values(SRS)
    .filter(c=>(c.reps||0)>0)
    .map(c=>({c,s:cardWeakness(c)}))
    .filter(x=>x.s>0.4)
    .sort((a,b)=>b.s-a.s)
    .slice(0,limit)
    .map(x=>x.c);
}
function startWeakReview(){ const w=weakCards(15); if(!w.length){ go('reviewhub'); return; } RV={ queue:w.slice(), reviewed:new Set(), total:w.length, revealed:false, mode:'weak' }; go('repaso'); }

/* ================= CLOUD SYNC (progress follows the account) =================
   Progress + SRS save locally (offline-first) AND push to the server when
   signed in. On entering the app we pull the server copy and MERGE it with
   local so nothing is lost across devices. */
let syncTimer=null, syncing=false;
function syncPush(){ if(!AUTH_ON) return; clearTimeout(syncTimer); syncTimer=setTimeout(syncPushNow, 900); }
async function syncPushNow(){ if(!AUTH_ON) return; try{ await fetch('api/progress_save.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:{prog:PROG,srs:SRS,custom:CUSTOM,tutor:TUTOR_SAVED}})}); }catch(e){} }
function mergeProgress(server){
  if(!server) return;
  const sp=server.prog||{}, ss=server.srs||{};
  PROG.xp=Math.max(PROG.xp||0, sp.xp||0);
  const comp=new Set([...(PROG.completed||[]), ...(sp.completed||[])]); PROG.completed=[...comp];
  PROG.mastery=PROG.mastery||{}; for(const k in (sp.mastery||{})) PROG.mastery[k]=Math.max(PROG.mastery[k]||0, sp.mastery[k]||0);
  if(sp.lastDay && (!PROG.lastDay || new Date(sp.lastDay) > new Date(PROG.lastDay))){ PROG.streak=sp.streak||PROG.streak; PROG.lastDay=sp.lastDay; }
  for(const id in ss){ const sc=ss[id], lc=SRS[id];
    if(!lc){ SRS[id]=sc; }
    else { const sL=sc.last||0, lL=lc.last||0; if(sL>lL || (sL===lL && (sc.reps||0)>(lc.reps||0))) SRS[id]=sc; }
  }
  // Studio lessons: union local + server by id so a device that lost its local
  // copy (app update / reinstall) gets every lesson back from the account.
  if(Array.isArray(server.custom)){
    const byId={};
    (CUSTOM||[]).forEach(u=>{ if(u&&u.unit&&u.unit.id) byId[u.unit.id]=u; });
    server.custom.forEach(u=>{ if(u&&u.unit&&u.unit.id && !byId[u.unit.id]) byId[u.unit.id]=u; });
    CUSTOM = Object.values(byId);
    try{ localStorage.setItem('fluenta_custom', JSON.stringify(CUSTOM)); }catch(e){}
  }
  // Saved tutor conversations: union by id, newest first.
  if(Array.isArray(server.tutor)){
    const byId={};
    server.tutor.forEach(s=>{ if(s&&s.id) byId[s.id]=s; });
    (TUTOR_SAVED||[]).forEach(s=>{ if(s&&s.id) byId[s.id]=s; });
    TUTOR_SAVED = Object.values(byId).sort((a,b)=>(b.ts||0)-(a.ts||0));
    try{ localStorage.setItem('fluenta_tutor_saved', JSON.stringify(TUTOR_SAVED)); }catch(e){}
  }
  try{ localStorage.setItem('aprende_prog', JSON.stringify(PROG)); localStorage.setItem('fluenta_srs', JSON.stringify(SRS)); }catch(e){}
}
async function syncPull(){ if(!AUTH_ON || syncing) return; syncing=true;
  try{ const r=await fetch('api/progress_get.php',{cache:'no-store'}); if(r.ok){ const j=await r.json(); mergeProgress(j.data); await syncPushNow(); } }catch(e){}
  syncing=false;
}

/* ---- In-lesson "Ask Luma": contextual help about the CURRENT exercise ---- */
function exContext(){
  const ex = (CUR && CUR.exercises) ? CUR.exercises[RUN.i] : null;
  if(!ex) return { sentence:'', ctx:'' };
  const strip = s => String(s||'').replace(/<[^>]+>/g,'').replace(/___/g,'____').trim();
  const sentence = strip(ex.prompt || ex.say || ex.tts || '');
  const en = strip(ex.prompt_en || ex.en || ex.translation || '');
  let extra = '';
  if(ex.type==='multiple_choice' || ex.type==='dialogue'){
    const opts=(ex.options||[]).map(o=>o.text||o).join(' / ');
    const ans=(ex.options||[]).find(o=>o.id===ex.answer); extra=`Options: ${opts}. Correct answer: ${ans?ans.text:ex.answer}.`;
  } else if(ex.type==='word_bank'){ extra=`Correct order: ${(ex.answer||[]).join(' ')}.`; }
  else if(ex.type==='fill_blank' || ex.type==='listening'){ extra=`Correct answer: ${(ex.accepted||[])[0]||''}.`; }
  else if(ex.type==='match_pairs'){ extra=`Pairs: ${(ex.pairs||[]).map(p=>p[0]+' = '+p[1]).join(', ')}.`; }
  else if(ex.type==='speak'){ extra=`Target phrase: ${strip(ex.say)}.`; }
  const unit = CUR.unit ? CUR.unit.title : 'this lesson';
  const ctx = `Context: I'm on lesson "${unit}". The exercise is: "${sentence}"${en?` (English: ${en})`:''}. ${extra}`.trim();
  return { sentence, en, ctx };
}
let ASK = { hist:[], busy:false };

  const c = exContext();

function askRender(){
  const box=document.getElementById('askreply'); if(!box) return;
  box.innerHTML='';
  ASK.hist.forEach(m=>{
    const row=el('div','ask-msg '+m.role);
    if(m.role==='assistant'){ const av=el('img','ask-av'); av.src='mascot/happy.png'; av.alt='Luma'; row.appendChild(av); }
    const bub=el('div','ask-bub'+(m.pending?' pending':''));
    if(m.pending) bub.innerHTML='<span class="tdot"></span><span class="tdot"></span><span class="tdot"></span>';
    else bub.textContent=m.content;
    row.appendChild(bub); box.appendChild(row);
  });
  box.scrollTop=box.scrollHeight;
}
async function askLumaSend(q){
  if(ASK.busy) return;
  if(!AUTH_ON){ ASK.hist.push({role:'assistant',content:'I’m offline — can’t reach the server. Connect via Profile → “Sign in to sync”. 🦉'}); askRender(); return; }
  ASK.busy=true;
  ASK.hist.push({role:'user',content:q});
  ASK.hist.push({role:'assistant',content:'',pending:true});
  askRender();
  // First turn carries the exercise context; follow-ups keep the short thread.
  const msgs=[];
  const real=ASK.hist.filter(m=>!m.pending);
  real.forEach((m,i)=>{
    const content = (m.role==='user' && i===0 && ASK.ctx) ? (ASK.ctx+'\n\nMy question: '+m.content) : m.content;
    msgs.push({role:m.role,content});
  });
  let reply;
  try{
    const r=await fetch('api/tutor.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:msgs})});
    const raw=await r.text(); let j={}; try{ j=JSON.parse(raw); }catch(_){ throw new Error('bad_json_'+r.status); }
    reply = j.reply || (j.error==='ai_not_configured'
      ? 'I’m not switched on yet — add your OpenAI key in Settings and I’ll explain anything. 🦉'
      : j.error==='not_authenticated' ? 'Please log in again so I can help. 🦉'
      : j.error==='upstream_unreachable' ? 'I can’t reach OpenAI from the server right now — check the key and that the server allows outbound requests.'
      : 'Sorry, I had trouble just now. Try again?');
  }catch(e){ reply = /bad_json/.test(e.message) ? ('The server didn’t reply correctly ('+e.message.replace('bad_json_','HTTP ')+'). Make sure /api is deployed and PHP is on.') : 'I couldn’t reach the server. Try again in a moment.'; }
  ASK.hist=ASK.hist.filter(m=>!m.pending);
  ASK.hist.push({role:'assistant',content:reply});
  ASK.busy=false; askRender();
}

    <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#3B82F6"/></linearGradient></defs>
    <circle cx="42" cy="42" r="${r}" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="7"/>
    <circle cx="42" cy="42" r="${r}" fill="none" stroke="url(#lg)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 42 42)"/>
    <text x="42" y="40" text-anchor="middle" class="lvr-n">${level}</text>
    <text x="42" y="54" text-anchor="middle" class="lvr-l">LEVEL</text>
  </svg>`;
}

/* ---- HOME ---- */
function renderHome(){
  let html=''; let lastCh=null; let g=0; let mi=0;
  // Rotating cast of Luma poses used to decorate the winding path (Duolingo-style).
  const POSES=['p-teach','celebrate','p-hi','love','p-party','talk','p-proud','sleep','p-idea','p-excited','p-cheer','encourage','p-thumb'];
  PATH.forEach((u,i)=>{
    const st=stateOf(i);
    if(u.chapter!==lastCh){
      html += `<div class="chapter-head"><div class="ch-rule"><span class="ch-badge">Chapter ${u.chapter||1}</span></div><span class="ch-t">${esc(u.chapter_title||'')}</span></div>`;
      lastCh=u.chapter;
    }
    // Serpentine horizontal offset — a gentle sine wave down the page.
    const off=Math.round(Math.sin(g*0.72)*58);
    // Drop a mascot beside every 4th node, tucked into the gutter opposite the bulge.
    let mascot='';
    if(g%4===2){
      const pose=POSES[mi++ % POSES.length];
      const pm = off>=0 ? -116 : 116;
      mascot = `<img class="path-mascot" src="mascot/${pose}.png" alt="" aria-hidden="true" style="left:calc(50% + ${pm}px)">`;
    }
    const glyph = st==='done'?'✓' : st==='soon'?'·' : st==='locked'?'🔒' : u.icon;
    const m = PROG.mastery[u.id];
    const sub = st==='soon'?'Coming soon' : st==='locked'?'Locked'
              : (st==='done' && m!=null)?('Mastery '+m+'%') : u.subtitle;
    html += `<div class="node ${st}" data-i="${i}" data-id="${u.id}" data-st="${st}" style="transform:translateX(${off}px)">
       ${mascot}
       <div class="medallion"><span>${glyph}</span></div>
       <div class="lbl">${esc(u.title)}<br><span style="opacity:.6;font-size:11px">${esc(sub)}</span></div></div>`;
    g++;
  });
  const activeU = PATH.find((u,i)=>stateOf(i)==='active');
  const feat = activeU ? `<button class="feat" id="featGo">
     <div class="feat-ic">${activeU.icon}</div>
     <div class="feat-txt"><span class="feat-k">Continue</span><span class="feat-t">${esc(activeU.title)}</span><span class="feat-s">${esc(activeU.subtitle)}</span></div>
     <span class="feat-arrow">→</span></button>` : '';
  const d=dueCards().length;
  const banner = d>0 ? `<button class="review-banner" id="goReview"><span class="rb-ic">🗂️</span><span class="rb-txt"><b>${d}</b> ${d===1?'card':'cards'} to review</span><span class="rb-go">Review →</span></button>` : '';

  app.innerHTML = `<div class="screen withnav">
    <div class="dash">
      <div class="dash-top">
        <img class="dash-luma" src="mascot/wave.png" alt="Luma" />
        <div class="dash-greet"><p class="hi">Welcome back${USER&&USER.name?', '+esc(USER.name):''} 👋</p><p class="hi-sub">Ready for today's Spanish?</p></div>
        ${levelRing(PROG.xp)}
      </div>
      <div class="chips">
        <div class="chip-stat"><span class="cs-ic">🔥</span><div><b>${PROG.streak}</b><span>day streak</span></div></div>
        <div class="chip-stat"><span class="cs-ic">⚡</span><div><b>${PROG.xp}</b><span>XP</span></div></div>
      </div>
      ${goalCard()}
    </div>
    ${feat}
    ${banner}
    <div class="path">${html}</div>
  </div>` + bottomNav('home');

  document.querySelectorAll('.node').forEach(n=>{
    const st=n.dataset.st;
    if(st==='active'||st==='done') n.querySelector('.medallion').onclick=()=>openUnit(n.dataset.id);
  });
  const fg=document.getElementById('featGo'); if(fg&&activeU) fg.onclick=()=>openUnit(activeU.id);
  const gr=document.getElementById('goReview'); if(gr) gr.onclick=startReview;
  const ge=document.getElementById('goalEdit'); if(ge) ge.onclick=goalSheet;
  wireNav();
}
/* ---- Daily goal card + streak-freeze (Step 3) ---- */
function goalCard(){
  const cur=todayXP(), goal=PROG.dailyGoal||30, pct=goalPct(), met=goalMet();
  const R=20, C=2*Math.PI*R, off=C*(1-pct/100);
  const ring=`<svg class="goal-ring" viewBox="0 0 48 48" width="48" height="48">
      <circle cx="24" cy="24" r="${R}" class="gr-track"/>
      <circle cx="24" cy="24" r="${R}" class="gr-fill ${met?'met':''}" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 24 24)"/>
      <text x="24" y="28" text-anchor="middle" class="gr-emoji">${met?'✓':'🎯'}</text>
    </svg>`;
  const freezePill=`<span class="freeze-pill" title="Streak freezes protect your streak on a missed day">❄️ ${PROG.freezes||0}</span>`;
  return `<button class="goal-card${met?' met':''}" id="goalEdit" aria-label="Daily goal">
      ${ring}
      <div class="goal-txt">
        <span class="goal-k">${met?'Daily goal reached! 🎉':'Daily goal'}</span>
        <span class="goal-v">${cur} / ${goal} XP today</span>
        <div class="goal-bar"><i style="width:${pct}%"></i></div>
      </div>
      ${freezePill}
    </button>`;
}
function goalSheet(){
  const html = `<p class="ip-sub">Set your daily XP goal</p>
    <div class="goal-opts">${GOAL_PRESETS.map(p=>`<button class="goal-opt${(PROG.dailyGoal===p.xp)?' on':''}" data-xp="${p.xp}"><b>${p.xp} XP</b><span>${p.l}</span></button>`).join('')}</div>
    <p class="ip-sub" style="margin-top:16px">Streak freeze ❄️</p>
    <p class="ip-body" style="color:var(--muted)">You have <b>${PROG.freezes||0}</b> freeze${(PROG.freezes||0)===1?'':'s'}. If you miss a day, a freeze is used automatically to keep your streak alive. You earn one every 7-day streak (max ${MAX_FREEZES}).</p>`;
  showInfo('Daily goal', html);
  document.querySelectorAll('.goal-opt').forEach(b=>b.onclick=()=>{ setGoal(+b.dataset.xp); const ov=document.getElementById('infobg'); if(ov) ov.remove(); });
}
function setGoal(xp){ PROG.dailyGoal=xp; saveProg(); if(SCREEN==='home') renderHome(); }
function streakNote(){
  const e=PROG._streakEvent||'';
  let msg='';
  if(e.includes('freeze') && !e.startsWith('up')){ const n=PROG._streakFroze||1; msg=`❄️ Streak freeze used — your <b>${PROG.streak}-day</b> streak is safe. ${PROG.freezes||0} left.`; }
  if(e.includes('freezeEarned')) msg=`❄️ +1 streak freeze earned — you now have <b>${PROG.freezes||0}</b>.`;
  return msg?`<div class="streak-note">${msg}</div>`:'';
}

async function openUnit(id){
  go('loading');
  try{ CUR=await loadUnit(id); RUN.i=0; RUN.correct=0; RUN.answered=0; RUN.gained=0; RUN.checked=false; go('grammar'); }
  catch(e){ go('needserver'); }
}

function bar(idx,grammar){ const pct=grammar?0:Math.round((idx/total())*100);
  const counter = grammar?'' : `<div class="stat count"><span class="glyph">◇</span>${idx+1}/${total()}</div>`;
  const ask = grammar ? '' : `<button class="ibtn askbtn" data-ask aria-label="Ask Luma">🦉</button>`;
  return `<div class="topbar"><button class="xbtn" data-close>×</button><div class="progress"><i style="width:${pct}%"></i></div>${ask}<button class="ibtn" data-info aria-label="Grammar tip">ⓘ</button>${counter}</div>`; }
function wireBar(){
  document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{ if(confirm("Leave? You'll lose this session's progress.")) go('home'); });
  document.querySelectorAll('[data-info]').forEach(b=>b.onclick=showGrammarInfo);
  document.querySelectorAll('[data-ask]').forEach(b=>b.onclick=askLuma);
}

/* ---- EXERCISE ROUTER ---- */
function renderExercise(){
  const ex=CUR.exercises[RUN.i]; RUN.checked=false; RUN.buf=null;
  const bodies={multiple_choice:mcBody,word_bank:wbBody,fill_blank:fbBody,match_pairs:mpBody,listening:lsBody,dialogue:dgBody,speak:spBody};
  app.innerHTML=`${bar(RUN.i)}<div class="screen"><p class="qtype">${labelFor(ex.type)}</p>${bodies[ex.type](ex)}</div><div id="foot"></div>`;
  wireBar();
  ({multiple_choice:mcWire,word_bank:wbWire,fill_blank:fbWire,match_pairs:mpWire,listening:lsWire,dialogue:dgWire,speak:spWire})[ex.type](ex);
}
function labelFor(t){ return {multiple_choice:"Choose the correct answer",word_bank:"Put the words in order",fill_blank:"Fill in the blank",match_pairs:"Match the pairs",listening:"Listen & type",dialogue:"Complete the conversation",speak:"Say it out loud"}[t]; }
function footCheck(on){ document.getElementById('foot').innerHTML=`<div class="actionbar"><button class="cta" id="check" ${on?'':'disabled'}>Check</button></div>`; }
function enableCheck(on){ const b=document.getElementById('check'); if(b) b.disabled=!on; }

/* 1. MULTIPLE CHOICE */
function mcBody(ex){ return `<div class="qtext">${ex.prompt}</div><div class="qhint">${esc(ex.prompt_en||'')}</div><div id="opts">${ex.options.map(o=>`<button class="opt" data-id="${o.id}"><span class="key">${o.id.toUpperCase()}</span><span>${esc(o.text)}</span></button>`).join('')}</div>`; }
function mcWire(ex){ footCheck(false);
  document.querySelectorAll('#opts .opt').forEach(o=>o.onclick=()=>{ if(RUN.checked)return; document.querySelectorAll('#opts .opt').forEach(x=>x.classList.remove('sel')); o.classList.add('sel'); RUN.buf=o.dataset.id; enableCheck(true); });
  document.getElementById('check').onclick=()=>{ const ok=RUN.buf===ex.answer; document.querySelectorAll('#opts .opt').forEach(x=>{ x.style.pointerEvents='none'; if(x.dataset.id===ex.answer)x.classList.add('correct'); else if(x.dataset.id===RUN.buf)x.classList.add('wrong'); }); showFeedback(ex,ok); };
}
/* 2. WORD BANK */
function wbBody(ex){ return `<div class="qtext">${ex.prompt}</div><div class="answerline" id="ans"></div><div class="bank" id="bank">${ex.tokens.map((t,i)=>`<button class="chip" data-i="${i}">${esc(t)}</button>`).join('')}</div>`; }
function wbWire(ex){ footCheck(false); RUN.buf=[]; const bank=document.getElementById('bank'),ans=document.getElementById('ans');
  bank.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ if(RUN.checked||c.classList.contains('used'))return; c.classList.add('used'); RUN.buf.push({i:c.dataset.i,t:c.textContent}); draw(); });
  function draw(){ ans.innerHTML=RUN.buf.map((x,k)=>`<button class="chip" data-k="${k}">${esc(x.t)}</button>`).join(''); ans.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{ if(RUN.checked)return; const r=RUN.buf.splice(+ch.dataset.k,1)[0]; bank.querySelector(`.chip[data-i="${r.i}"]`).classList.remove('used'); draw(); }); enableCheck(RUN.buf.length>0); }
  document.getElementById('check').onclick=()=>showFeedback(ex, RUN.buf.map(x=>x.t).join(' ')===ex.answer.join(' '));
}
/* 3. FILL BLANK */
function fbBody(ex){ return `<div class="qtext">${ex.prompt.replace('___','<span style="color:var(--cyan)">____</span>')}</div><div class="qhint">${esc(ex.prompt_en||'')} ${ex.hint?'· '+esc(ex.hint):''}</div><input class="field" id="fld" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="Type here…" />`; }
function fbWire(ex){ footCheck(false); const f=document.getElementById('fld'); f.oninput=()=>enableCheck(f.value.trim().length>0); f.onkeydown=e=>{ if(e.key==='Enter'&&f.value.trim())document.getElementById('check').click(); };
  document.getElementById('check').onclick=()=>{ f.disabled=true; showFeedback(ex, ex.accepted.some(a=>norm(a,ex.ignore_accents)===norm(f.value,ex.ignore_accents))); }; setTimeout(()=>f.focus(),120);
}
/* 4. MATCH PAIRS */
function mpBody(ex){ const L=ex.pairs.map(p=>p[0]),R=ex.pairs.map(p=>p[1]).slice().sort(()=>Math.random()-.5);
  return `<div class="qtext" style="font-size:20px">${ex.prompt}</div><div class="match" style="margin-top:18px"><div class="mcol">${L.map(l=>`<div class="mtile" data-side="L" data-v="${esc(l)}">${esc(l)}</div>`).join('')}</div><div class="mcol">${R.map(r=>`<div class="mtile" data-side="R" data-v="${esc(r)}">${esc(r)}</div>`).join('')}</div></div>`; }
function mpWire(ex){ document.getElementById('foot').innerHTML=''; const map={}; ex.pairs.forEach(p=>map[p[0]]=p[1]); let pick=null,done=0;
  document.querySelectorAll('.mtile').forEach(t=>t.onclick=()=>{ if(t.classList.contains('done'))return;
    if(!pick){ pick=t; t.classList.add('sel'); return; }
    if(t===pick){ t.classList.remove('sel'); pick=null; return; }
    if(t.dataset.side===pick.dataset.side){ pick.classList.remove('sel'); pick=t; t.classList.add('sel'); return; }
    const Lt=pick.dataset.side==='L'?pick:t, Rt=pick.dataset.side==='R'?pick:t;
    if(map[Lt.dataset.v]===Rt.dataset.v){ Lt.classList.add('done'); Rt.classList.add('done'); Lt.classList.remove('sel'); Rt.classList.remove('sel'); pick=null; if(++done===ex.pairs.length) showFeedback(ex,true); }
    else { Lt.classList.add('miss'); Rt.classList.add('miss'); setTimeout(()=>{ Lt.classList.remove('miss','sel'); Rt.classList.remove('miss','sel'); },320); pick=null; }
  });
}
/* 5. LISTENING */

function lsWire(ex){ footCheck(false); document.getElementById('play').onclick=()=>speak(ex.tts); document.getElementById('replay').onclick=()=>speak(ex.tts,.6);

/* 6. DIALOGUE (Babbel-style: pick the natural response in a real scene) */
function dgBody(ex){
  const bubbles = (ex.lines||[]).map(l=>{
    const mine=/^(you|t[úu])$/i.test(l.speaker||'');
    if(l.blank) return `<div class="dbub ${mine?'me':'them'} blank" id="dblank"><span class="dsp">${esc(l.speaker)}</span><span class="dtx">…</span></div>`;
    return `<div class="dbub ${mine?'me':'them'}"><span class="dsp">${esc(l.speaker)}</span><span class="dtx">${esc(l.es)} <button class="dsnd" data-say="${esc(l.es)}" aria-label="Listen">🔊</button></span>${l.en?`<span class="den">${esc(l.en)}</span>`:''}</div>`;
  }).join('');
  return `<p class="dscn">${esc(ex.scenario||'')}</p><div class="dlg">${bubbles}</div>
    <p class="qhint">Choose the natural reply:</p>
    <div id="opts" class="dopts">${ex.options.map(o=>`<button class="opt" data-id="${o.id}"><span>${esc(o.text)}</span></button>`).join('')}</div>`;
}
function dgWire(ex){ footCheck(false);
  const spoken=(ex.lines||[]).filter(l=>!l.blank && l.es);
  setTimeout(()=>{ if(spoken[0]) speak(spoken[0].es); },350);
  document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say));
  document.querySelectorAll('#opts .opt').forEach(o=>o.onclick=()=>{ if(RUN.checked)return;
    document.querySelectorAll('#opts .opt').forEach(x=>x.classList.remove('sel')); o.classList.add('sel'); RUN.buf=o.dataset.id;
    const chosen=ex.options.find(x=>x.id===o.dataset.id); const bl=document.getElementById('dblank'); if(bl&&chosen){ bl.querySelector('.dtx').textContent=chosen.text; }
    enableCheck(true); });
  document.getElementById('check').onclick=()=>{ const ok=RUN.buf===ex.answer;
    document.querySelectorAll('#opts .opt').forEach(x=>{ x.style.pointerEvents='none'; if(x.dataset.id===ex.answer)x.classList.add('correct'); else if(x.dataset.id===RUN.buf)x.classList.add('wrong'); });
    const bl=document.getElementById('dblank'), ans=ex.options.find(x=>x.id===ex.answer);
    if(bl&&ans){ bl.querySelector('.dtx').textContent=ans.text; bl.classList.remove('blank'); if(ok) setTimeout(()=>speak(ans.text),250); }
    showFeedback(ex,ok); };
}

/* 7. SPEAK (pronunciation practice) */
function spBody(ex){ return `<div class="qtext">${esc(ex.say)}</div><div class="qhint">${esc(ex.en||'')}</div>
  <button class="replay" id="hear">🔊 Hear it</button>
  <div class="mic-wrap"><button class="micbtn" id="mic" aria-label="Record"><span class="mic-ic">🎤</span></button><p class="mic-status" id="micStatus">Tap the mic and say it</p></div>`; }
function spWire(ex){
  document.getElementById('foot').innerHTML=`<div class="actionbar"><button class="cta ghost" id="skip">Skip</button></div>`;
  document.getElementById('skip').onclick=()=>{ const last=RUN.i===total()-1; if(last) finish(); else { RUN.i++; go('exercise'); } };
  document.getElementById('hear').onclick=()=>speak(ex.say);
  setTimeout(()=>speak(ex.say),350);
  const mic=document.getElementById('mic'), status=document.getElementById('micStatus');
  let rec=null, chunks=[], recording=false;
  mic.onclick=async()=>{
    if(recording){ recording=false; mic.classList.remove('rec'); status.textContent='Checking…'; try{rec.stop();}catch(e){} return; }
    if(!navigator.mediaDevices||!window.MediaRecorder){ status.textContent='Recording isn’t supported here — tap Skip.'; return; }
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      rec=new MediaRecorder(stream); chunks=[];
      rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
      rec.onstop=async()=>{ stream.getTracks().forEach(t=>t.stop());
        const blob=new Blob(chunks,{type:(rec&&rec.mimeType)||'audio/webm'});
        const fd=new FormData(); fd.append('audio',blob,'speech');
        try{
          const r=await fetch('api/pronounce.php',{method:'POST',body:fd}); const j=await r.json();
          if(j.transcript!=null){ gradePron(ex,j.transcript); }
          else { mic.classList.remove('rec'); status.textContent = j.error==='ai_not_configured' ? 'Pronunciation needs the OpenAI key set in config.php.' : 'Couldn’t check that — tap the mic to try again.'; }
        }catch(e){ mic.classList.remove('rec'); status.textContent='Network error — tap the mic to try again.'; }
      };
      rec.start(); recording=true; mic.classList.add('rec'); status.textContent='Listening… tap to stop';
    }catch(e){ status.textContent='Microphone blocked. Allow it, or tap Skip.'; }
  };
}
function gradePron(ex, transcript){
  const t=norm(transcript,true), target=norm(ex.say,true);
  const ok = t===target || (t && target && (t.includes(target)||target.includes(t)));
  RUN.answered++; if(ok){ RUN.correct++; RUN.gained+=ex.xp; }
  const heard = transcript ? ` <span style="color:var(--muted)">I heard: “${esc(transcript)}”</span>` : '';
  renderFeedback(ok, (ok ? (ex.ok||'¡Perfecto! Great pronunciation.') : (ex.no||'Not quite — listen again and match the sound.')) + heard);
}

/* ---- FEEDBACK ---- */
function renderFeedback(ok, msg){
  RUN.checked=true; RUN.lastCorrect=ok;
  const last=RUN.i===total()-1;
  document.getElementById('foot').innerHTML=`<div class="feedback ${ok?'correct':'wrong'}"><div class="fh"><img class="fb-luma" src="mascot/${ok?'happy':'encourage'}.png" alt="" />${ok?'Correct!':'Not quite…'}</div><div class="fb">${msg}</div><button class="cta ${ok?'ok':''}" id="cont">${last?'Finish':'Continue'}</button></div>`;
  document.getElementById('cont').onclick=()=>{ if(last) finish(); else { RUN.i++; go('exercise'); } };
}

/* Validate + normalise the model's lesson so the engine can play it safely. */
function sanitizeCustomLesson(L, topic){
  if(!L || typeof L!=='object') return null;
  const id='custom-'+Date.now();
  const u=L.unit||{};
  const title=(u.title||topic||'Custom lesson').toString().slice(0,60);
  const okId=s=>typeof s==='string'&&s.length;
  const exs=[];
  (Array.isArray(L.exercises)?L.exercises:[]).forEach((ex,i)=>{
    if(!ex||typeof ex!=='object'||!ex.type) return;
    ex.id=ex.id||('e'+i); ex.xp=ex.xp||2;
    if(ex.type==='multiple_choice'||ex.type==='dialogue'){
      const opts=Array.isArray(ex.options)?ex.options.filter(o=>o&&okId(o.id)&&('text'in o)):[];
      if(opts.length<2) return;
      if(!opts.some(o=>o.id===ex.answer)) return;
      ex.options=opts;
      if(ex.type==='dialogue'){ if(!Array.isArray(ex.lines)||!ex.lines.some(l=>l&&l.blank)) return; }
    } else if(ex.type==='word_bank'){
      if(!Array.isArray(ex.tokens)||!Array.isArray(ex.answer)||!ex.answer.length) return;
      if(!ex.answer.every(t=>ex.tokens.includes(t))) return;
    } else if(ex.type==='fill_blank'){
      if(!Array.isArray(ex.accepted)||!ex.accepted.length) return;
    } else if(ex.type==='match_pairs'){
      if(!Array.isArray(ex.pairs)||ex.pairs.length<3||!ex.pairs.every(p=>Array.isArray(p)&&p.length===2)) return;
    } else if(ex.type==='listening'){
      if(!ex.tts||!Array.isArray(ex.accepted)||!ex.accepted.length) return;
    } else if(ex.type==='speak'){
      if(!ex.say) return;
    } else return;
    exs.push(ex);
  });
  if(exs.length<4) return null;   // too broken to be a real lesson
  const vocab=(Array.isArray(L.vocab)?L.vocab:[]).filter(v=>v&&v.es&&v.en).slice(0,10);
  const ves=new Set(vocab.map(v=>v.es));
  let srs=(L.completion&&Array.isArray(L.completion.adds_vocab_to_srs)?L.completion.adds_vocab_to_srs:[]).filter(s=>ves.has(s));
  if(srs.length<Math.min(5,vocab.length)) srs=vocab.slice(0,5).map(v=>v.es);
  const g=L.grammar||{};
  return {
    unit:{ id, title, subtitle:(u.subtitle||topic).toString().slice(0,60), level:(u.level||STUDIO_LEVEL), xp_reward:20, custom:true, topic },
    grammar:{
      title:g.title||title,
      intro:g.intro||('Useful Spanish for: '+esc(topic)+'.'),
      sections:Array.isArray(g.sections)&&g.sections.length?g.sections:[{tag:'',heading:'Key phrases',body:'Review these, then practice.',ex:vocab.slice(0,6).map(v=>({es:v.es,en:v.en,note:''}))}],
      takeaways:Array.isArray(g.takeaways)?g.takeaways:vocab.slice(0,4).map(v=>`${v.es} — ${v.en}`),
      mistakes:Array.isArray(g.mistakes)?g.mistakes:[]
    },
    exercises:exs,
    vocab:vocab.length?vocab:[{es:title,en:topic}],
    completion:{ xp_on_complete:20, adds_vocab_to_srs:srs }
  };
}
/* Collect the spoken Spanish in a custom lesson and generate real TTS clips
   for it (so speak() plays audio instead of falling back to robotic TTS). */
/* All spoken Spanish in a lesson (vocab + listening + speak + dialogue). */
function lessonSpokenStrings(unit){
  const set=new Set();
  (unit.vocab||[]).forEach(v=>v&&v.es&&set.add(v.es.trim()));
  (unit.exercises||[]).forEach(ex=>{
    if(ex.type==='listening'&&ex.tts) set.add(ex.tts.trim());
    if(ex.type==='speak'&&ex.say) set.add(ex.say.trim());
    if(ex.type==='dialogue'){ (ex.lines||[]).forEach(l=>{ if(l&&!l.blank&&l.es) set.add(l.es.trim()); }); (ex.options||[]).forEach(o=>{ if(o&&o.text) set.add(o.text.trim()); }); }
  });
  return [...set].filter(Boolean);
}
/* Generate real OpenAI audio for one custom lesson's phrases. Returns the
   server result ({ok,generated,had,...} or {error}). */
async function genCustomAudio(unit){
  const strings=lessonSpokenStrings(unit);
  if(!strings.length) return {ok:true,generated:0,had:0};
  const voice=(document.getElementById('gaVoice')&&document.getElementById('gaVoice').value)||'coral';
  try{
    const r=await fetch('api/gen_audio_strings.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({strings,voice})});
    const raw=await r.text(); let j={}; try{ j=JSON.parse(raw); }catch(_){ return {error:'bad_json_'+r.status}; }
    await loadAudio();   // refresh manifest so the new clips play immediately
    return j;
  }catch(e){ return {error:'network'}; }
}
/* Per-lesson "🔊" button in the Studio: voice this lesson on demand. */
async function studioGenAudio(id, btn){

  const res=await genCustomAudio(unit);
  btn.disabled=false;
  if(res && res.ok){ btn.textContent='✓'; setTimeout(()=>{ btn.textContent=orig; }, 2500);
    if((res.generated||0)===0 && (res.had||0)>0){ /* already voiced */ } }
